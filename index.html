<!-- index.html (repo root) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness — Ball Pick</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg1:#07162f; --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff; --muted:#9db7e6;
      --blue:#2a66ff; --orange:#ff7a00; --orange2:#ff9d2f;
      --good:#30d158; --bad:#ff453a;
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --glass: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.26), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    /* Top bar */
    .topbar{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background:linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.12));
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .topInner{
      max-width:1280px; margin:0 auto; padding:16px 18px;
      display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .brand{display:flex; gap:12px; align-items:center}
    .mark{
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg,var(--orange),var(--blue));
      position:relative;overflow:hidden;
      box-shadow:0 12px 22px rgba(0,0,0,.35)
    }
    .mark:after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 55%);transform:rotate(20deg)}
    h1{
      margin:0; font-family:Oswald,Inter,sans-serif;
      letter-spacing:.8px; font-size:28px; line-height:1;
    }
    .sub{margin-top:4px;color:var(--muted);font-size:12px;font-weight:900}

    .controls{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }
    .pill{
      display:flex; gap:10px; align-items:center;
      padding:10px 12px; border-radius:999px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
    }
    .pill span{color:var(--muted);font-size:12px}
    .pill b{font-family:Oswald,Inter,sans-serif;letter-spacing:.5px}

    .btn{
      border:none;border-radius:14px;padding:11px 14px;color:white;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,var(--orange),#ff4d00);
      box-shadow:0 12px 26px rgba(255,122,0,.22);
      user-select:none;
    }
    .btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:none;
    }
    .btn:disabled{opacity:.55;cursor:not-allowed}

    .stage{max-width:1280px; margin:0 auto; padding:18px;}
    .hintBar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin:10px 0 16px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.10);
      background:var(--glass);
      border-radius:18px;
      box-shadow:var(--shadow);
    }
    .hintBar .left{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      color:var(--muted); font-weight:900; font-size:12px;
    }
    .hintBar b{color:var(--text)}
    .inlineInputs{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }
    input{
      width:min(320px, 88vw);
      border-radius:14px;padding:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.24);color:var(--text);
      outline:none;font-weight:800
    }

    .ballGrid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));
      gap:18px;
      align-items:center;
      justify-items:center;
      padding:10px 0 24px;
    }
    @media (max-width:520px){
      .ballGrid{grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:14px;}
    }

    /* 3D ball */
    .ball{
      width:92px;height:92px;border-radius:50%;
      position:relative;
      cursor:pointer;
      transform-style:preserve-3d;
      perspective:900px;
      background:
        radial-gradient(circle at 26% 24%, rgba(255,255,255,.65), transparent 32%),
        radial-gradient(circle at 68% 78%, rgba(0,0,0,.40), transparent 46%),
        radial-gradient(circle at 50% 50%, var(--orange2), var(--orange));
      box-shadow:
        inset -22px -22px 28px rgba(0,0,0,.58),
        inset 14px 16px 20px rgba(255,255,255,.12),
        0 22px 26px rgba(0,0,0,.56);
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
      transition: transform .14s ease, filter .14s ease, opacity .2s ease;
    }
    .ball:before{
      content:"";
      position:absolute; inset:-30%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,255,255,.28), transparent 42%),
        repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.12) 0 1px, transparent 1px 6px);
      opacity:.35;
      transform:rotate(16deg);
      pointer-events:none;
    }
    .seamH{position:absolute;left:-12%;right:-12%;height:4px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.78)}
    .seamV{position:absolute;top:-12%;bottom:-12%;width:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78)}
    .ball:hover{filter:brightness(1.07);transform:translateY(-2px) scale(1.02)}
    .ball.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.15);transform:none}

    /* Spin only on pick */
    @keyframes pickSpin{
      0%{transform:rotateY(0) rotateX(0) scale(1)}
      60%{transform:rotateY(620deg) rotateX(250deg) scale(1.06)}
      100%{transform:rotateY(980deg) rotateX(360deg) scale(1)}
    }
    .ball.spin{animation:pickSpin 1.2s cubic-bezier(.2,.9,.1,1)}

    /* Locked overlay */
    .lock{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.10), rgba(0,0,0,.45));
      opacity:0; transition:opacity .2s ease;
    }
    .ball.disabled .lock{opacity:1}
    .lock svg{opacity:.55}

    /* Reveal modal */
    .revealBack{
      position:fixed; inset:0;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.56);
      z-index:999;
      backdrop-filter: blur(10px);
      padding:18px;
    }
    .reveal{
      width:min(640px, 96vw);
      border-radius:22px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .revealTop{
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .revealTop h2{
      margin:0;
      font-family:Oswald,Inter,sans-serif;
      letter-spacing:.6px;
      font-size:18px;
    }
    .x{
      cursor:pointer; font-weight:900;
      color:var(--muted);
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      user-select:none;
    }
    .revealBody{padding:16px; display:grid; gap:14px;}
    .card{
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.26);
      padding:16px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:-40%;
      background:
        radial-gradient(circle at 26% 26%, rgba(42,102,255,.30), transparent 55%),
        radial-gradient(circle at 74% 74%, rgba(255,122,0,.26), transparent 55%);
      transform:rotate(18deg);
      opacity:.9;
      pointer-events:none;
    }
    .cardInner{position:relative; z-index:1}
    .slotBig{
      margin:0;
      font-family:Oswald,Inter,sans-serif;
      font-size:68px;
      letter-spacing:2px;
      line-height:1;
      text-shadow:0 18px 46px rgba(0,0,0,.55);
    }
    .miniRow{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    .mini{
      display:inline-flex; gap:8px; align-items:center;
      padding:10px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      color:var(--muted);
    }
    .mini b{color:var(--text)}
    .note{color:var(--muted); font-weight:900; font-size:12px; line-height:1.35}
    .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}

    .toast{
      position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);
      padding:12px 14px;border-radius:14px;box-shadow:var(--shadow);
      font-weight:900;display:none;z-index:999;backdrop-filter:blur(10px)
    }
    .toast.show{display:block}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topInner">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>Money Madness Ball Pick</h1>
          <div class="sub">Pick a blank ball → it spins once → reveals your bracket slot</div>
        </div>
      </div>

      <div class="controls">
        <div class="pill"><span>BALLS LEFT</span><b id="ballsLeft">—</b></div>
        <button class="btn secondary" id="viewBracket">View Bracket</button>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="hintBar">
      <div class="left">
        <span>Status:</span> <b id="statusTag">Paste token</b>
        <span style="opacity:.6">•</span>
        <span>Player:</span> <b id="playerTag">—</b>
      </div>

      <div class="inlineInputs">
        <input id="name" placeholder="Your name" autocomplete="name" spellcheck="false">
        <input id="token" placeholder="Invite token" autocomplete="off" spellcheck="false">
        <button class="btn secondary" id="saveBtn">Save</button>
      </div>
    </div>

    <div class="ballGrid" id="ballGrid"></div>
  </div>

  <!-- Reveal modal -->
  <div class="revealBack" id="revealBack">
    <div class="reveal" role="dialog" aria-modal="true">
      <div class="revealTop">
        <h2>Position Locked</h2>
        <div class="x" id="closeReveal">Close</div>
      </div>
      <div class="revealBody">
        <div class="card">
          <div class="cardInner">
            <div class="note" style="margin-bottom:10px">Your bracket slot</div>
            <h3 class="slotBig" id="slotBig">—</h3>
            <div class="miniRow">
              <div class="mini">Region: <b id="slotRegion">—</b></div>
              <div class="mini">Seed: <b id="slotSeed">—</b></div>
            </div>
            <div class="note" style="margin-top:12px">
              Teams will populate after Selection Sunday. Your name stays pinned to this slot.
            </div>
            <div class="actions">
              <button class="btn" id="openBracketNow">Open Live Bracket</button>
              <button class="btn secondary" id="okBtn">Done</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <audio id="sndClick" preload="auto" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="sndCheer" preload="auto" src="https://actions.google.com/sounds/v1/crowds/medium_crowd_cheer.ogg"></audio>
  <audio id="sndBuzz" preload="auto" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

  <script>
    // ✅ Your Web App URL
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const BALL_COUNT = 68;
    const POLL_MS = 9000;

    const el = (id)=>document.getElementById(id);
    const toastEl = el("toast");
    const snd = { click: el("sndClick"), cheer: el("sndCheer"), buzz: el("sndBuzz") };
    let locked = false;

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(()=>toastEl.classList.remove("show"), 2400);
    }
    function confettiBurst(){
      try{ confetti({ particleCount: 140, spread: 70, origin:{ y:0.75 } }); }catch{}
    }
    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);
        window[cb] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
        function cleanup(){ try{ delete window[cb]; }catch{} script.remove(); }
        script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error("JSONP load error")); };

        document.head.appendChild(script);
      });
    }
    function setStatus(text, good=true){
      el("statusTag").textContent = text;
      el("statusTag").style.color = good ? "var(--good)" : "var(--bad)";
    }

    function makeBall(){
      const d = document.createElement("div");
      d.className = "ball";
      d.innerHTML = `
        <div class="seamH"></div><div class="seamV"></div>
        <div class="lock" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round"/>
            <rect x="6" y="11" width="12" height="10" rx="2" stroke="rgba(255,255,255,.7)" stroke-width="2"/>
          </svg>
        </div>
      `;
      d.addEventListener("click", () => onBallClick(d));
      return d;
    }
    function buildRack(){
      const grid = el("ballGrid");
      grid.innerHTML = "";
      for(let i=0;i<BALL_COUNT;i++) grid.appendChild(makeBall());
    }

    function lockUI(v){
      locked = v;
      el("saveBtn").disabled = v;
      el("refreshBtn").disabled = v;
      el("token").disabled = v;
      el("name").disabled = v;
      document.querySelectorAll(".ball").forEach(b => {
        if(v) b.classList.add("disabled");
        else if(!b.dataset.locked) b.classList.remove("disabled");
      });
    }

    function showReveal(slotKey, region, seed){
      el("slotBig").textContent = slotKey || "—";
      el("slotRegion").textContent = region || "—";
      el("slotSeed").textContent = seed || "—";
      el("revealBack").style.display = "flex";
    }
    function hideReveal(){ el("revealBack").style.display = "none"; }

    async function saveName(){
      const token = el("token").value.trim();
      const name = el("name").value.trim();
      if(!token){ toast("Paste your invite token first."); return; }
      if(!name){ toast("Type your name first."); return; }

      lockUI(true);
      try{
        const res = await jsonp(API, { action:"setname", token, name });
        if(!res || !res.ok){ toast(res?.error || "Save failed"); setStatus("Name save failed", false); return; }
        toast("Name saved!");
        await loadState();
      }catch{
        toast("API error saving name.");
        setStatus("API error", false);
      }finally{
        lockUI(false);
      }
    }

    async function loadState(){
      const token = el("token").value.trim();
      if(!token){ setStatus("Paste token", false); return; }

      setStatus("Loading…", true);
      try{
        const data = await jsonp(API, { action:"getState", token });
        if(!data || !data.ok){
          setStatus(data?.error || "Load failed", false);
          toast(data?.error || "Load failed");
          return;
        }
        el("ballsLeft").textContent = String(data.ballsRemaining ?? "—");
        el("playerTag").textContent = data.playerName || "—";
        setStatus("Ready", true);
      }catch{
        setStatus("API error", false);
        toast("API error.");
      }
    }

    async function onBallClick(ballEl){
      if(locked) return;

      const token = el("token").value.trim();
      const name = el("name").value.trim();
      if(!token){ toast("Paste your invite token first."); return; }
      if(!name){ toast("Type your name first."); return; }

      lockUI(true);

      // Save name first (server must support action=setname)
      try{
        const save = await jsonp(API, { action:"setname", token, name });
        if(!save || !save.ok){ snd.buzz?.play?.(); toast(save?.error || "Name save failed"); lockUI(false); return; }
      }catch{
        snd.buzz?.play?.(); toast("Name save failed (API error)."); lockUI(false); return;
      }

      snd.click?.play?.();
      ballEl.classList.add("spin");

      try{
        const res = await jsonp(API, { action:"pickBall", token });
        if(!res || !res.ok){
          snd.buzz?.play?.();
          toast(res?.error || "Pick failed");
          ballEl.classList.remove("spin");
          lockUI(false);
          return;
        }

        // Lock after spin
        setTimeout(() => {
          ballEl.dataset.locked = "1";
          ballEl.classList.add("disabled");
        }, 780);

        // Reveal + confetti
        setTimeout(() => {
          snd.cheer?.play?.();
          confettiBurst();
          const slotKey = res.pick?.slotKey || "";
          const region = res.pick?.region || "";
          const seed = res.pick?.seed || "";
          toast(`Locked: ${slotKey}`);
          showReveal(slotKey, region, seed);
        }, 820);

        await loadState();

        // Auto-navigate to bracket after the reveal moment
        setTimeout(() => {
          const tok = el("token").value.trim();
          const slotKey = res.pick?.slotKey || "";
          const url =
            "./bracket.html"
            + (tok ? ("?token=" + encodeURIComponent(tok)) : "")
            + (slotKey ? ((tok ? "&" : "?") + "slot=" + encodeURIComponent(slotKey)) : "");
          window.location.href = url;
        }, 1250);

      }catch{
        snd.buzz?.play?.();
        toast("Pick failed (API error).");
      }finally{
        lockUI(false);
      }
    }

    function init(){
      buildRack();

      const params = new URLSearchParams(location.search);
      const t = (params.get("token") || "").trim();
      if(t) el("token").value = t;

      el("saveBtn").addEventListener("click", saveName);
      el("refreshBtn").addEventListener("click", loadState);

      el("viewBracket").addEventListener("click", () => {
        const tok = el("token").value.trim();
        const url = "./bracket.html" + (tok ? ("?token=" + encodeURIComponent(tok)) : "");
        window.location.href = url;
      });

      el("closeReveal").addEventListener("click", hideReveal);
      el("okBtn").addEventListener("click", hideReveal);
      el("revealBack").addEventListener("click", (e)=>{ if(e.target === el("revealBack")) hideReveal(); });

      el("openBracketNow").addEventListener("click", () => {
        const tok = el("token").value.trim();
        const slotKey = el("slotBig").textContent.trim();
        const url =
          "./bracket.html"
          + (tok ? ("?token=" + encodeURIComponent(tok)) : "")
          + (slotKey ? ((tok ? "&" : "?") + "slot=" + encodeURIComponent(slotKey)) : "");
        window.location.href = url;
      });

      if(el("token").value.trim()) loadState();
      setInterval(()=>{ if(el("token").value.trim()) loadState(); }, POLL_MS);
    }
    init();
  </script>
</body>
</html>
