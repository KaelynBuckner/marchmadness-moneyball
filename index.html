<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness Ball Pick</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg0:#05070c;
      --bg1:#0a1020;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text:#ffffff;
      --muted: rgba(255,255,255,.72);
      --hot: rgba(255,140,40,.9);
      --shadow: 0 18px 55px rgba(0,0,0,.60);
      --maxW: 1150px;

      --ballSize: 82px;
      --gap: 14px;
    }
  <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
  <div style="
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.08);
    font-weight:900; letter-spacing:.2px; text-transform:uppercase;
    font-size:12px;">
  <span style="width:8px;height:8px;border-radius:99px;background:rgba(255,80,80,.95);box-shadow:0 0 12px rgba(255,80,80,.35);"></span>
     LIVE BOARD
  </div>
  </div>
    *{ box-sizing:border-box; }
    body{
      margin:0;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 700px at 12% 8%, rgba(255,140,40,.12), transparent 60%),
        radial-gradient(900px 600px at 88% 20%, rgba(88,170,255,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }

    header{
      padding: 22px 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }

    .wrap{ max-width: var(--maxW); margin: 0 auto; padding: 0 16px; }
    .titleRow{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    h1{
      margin:0; font-size: 42px; line-height: 1.02;
      letter-spacing: .2px; font-weight: 950; text-transform: uppercase;
    }
    .sub{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 860px;
      line-height: 1.35;
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      height: 40px; padding: 0 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.09);
      color: #fff;
      font-weight: 800;
      text-decoration:none;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,.13); transform: translateY(-1px); }

    .panel{
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
    }

    .bar{
      display:grid;
      gap: 12px;
      grid-template-columns: 1.1fr 0.9fr;
      align-items:end;
    }
    @media (max-width: 760px){
      h1{ font-size: 34px; }
      .bar{ grid-template-columns: 1fr; }
      :root{ --ballSize: 76px; }
    }

    label{
      display:grid; gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,.88);
      font-weight: 750;
    }
    input{
      height: 44px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: #fff;
      outline: none;
      font-size: 15px;
    }
    input::placeholder{ color: rgba(255,255,255,.55); }
    input:focus{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 0 0 4px rgba(88,170,255,.12);
    }

    .hint{ font-size: 12px; color: rgba(255,255,255,.62); margin-top: 2px; font-weight: 600; }

    .statusLine{
      margin-top: 12px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      font-size: 13px;
      color: rgba(255,255,255,.86);
      white-space: nowrap;
    }
    .pill small{ opacity:.7; font-weight: 650; }

    main{ padding: 16px 0 44px; }

    .grid{
      display:grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: var(--gap);
      padding: 14px 4px 0;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 640px){ .grid{ grid-template-columns: repeat(4, 1fr); } }

    /* 3D Basketball */
    /* ===== ESPN-ish background texture overlay ===== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(transparent 0 0),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 34px);
  mix-blend-mode: overlay;
  opacity:.35;
}

/* ===== Realistic Basketball ===== */
.ball{
  position: relative;
  height: var(--ballSize);
  width: 100%;
  border-radius: 999px;
  cursor: pointer;
  user-select: none;

  transform-style: preserve-3d;
  perspective: 1000px;

  /* Base leather shading */
  background:
    radial-gradient(circle at 28% 22%, rgba(255,255,255,.65), rgba(255,255,255,0) 34%),
    radial-gradient(circle at 68% 78%, rgba(0,0,0,.35), rgba(0,0,0,0) 50%),
    radial-gradient(circle at 50% 55%, #ff8a2b, #e85d00 62%, #b54000 100%);

  box-shadow:
    0 16px 34px rgba(0,0,0,.52),
    inset 0 10px 20px rgba(255,255,255,.16),
    inset 0 -16px 22px rgba(0,0,0,.28);

  transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, opacity .18s ease;
  display:grid;
  place-items:center;
  overflow:hidden;
}

/* Pebble grain layer */
.ball::after{
  content:"";
  position:absolute;
  inset:-10%;
  border-radius:999px;
  background:
    radial-gradient(circle, rgba(0,0,0,.22) 1px, transparent 1.4px) 0 0 / 9px 9px;
  opacity:.22;
  transform: translateZ(7px);
  mix-blend-mode: multiply;
  pointer-events:none;
}

/* Seams */
.ball::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:999px;
  background:
    radial-gradient(circle at 50% 50%, transparent 44%, rgba(25,10,0,.55) 45%, rgba(25,10,0,.55) 47%, transparent 48%),
    linear-gradient(90deg, transparent 46%, rgba(25,10,0,.55) 47%, rgba(25,10,0,.55) 53%, transparent 54%),
    linear-gradient(0deg, transparent 46%, rgba(25,10,0,.55) 47%, rgba(25,10,0,.55) 53%, transparent 54%);
  opacity:.70;
  transform: translateZ(10px);
  pointer-events:none;
}

/* Rim light */
.ball .rim{
  position:absolute;
  inset:2px;
  border-radius:999px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.14),
    inset 0 0 24px rgba(255,255,255,.08);
  pointer-events:none;
  transform: translateZ(12px);
}

.ball:hover{
  transform: translateY(-4px) rotateX(12deg) rotateY(-14deg);
  box-shadow:
    0 22px 46px rgba(0,0,0,.62),
    0 0 26px rgba(88,170,255,.16),
    inset 0 10px 22px rgba(255,255,255,.18),
    inset 0 -16px 22px rgba(0,0,0,.26);
}

.ball.taken{
  cursor:not-allowed;
  filter: grayscale(.92) brightness(.72);
  opacity: .55;
  transform:none;
}

.ball.taken:hover{
  transform:none;
  box-shadow:
    0 16px 34px rgba(0,0,0,.52),
    inset 0 10px 20px rgba(255,255,255,.12),
    inset 0 -16px 22px rgba(0,0,0,.28);
}

/* Better spin: momentum + small glow pulse */
@keyframes spin3dPro {
  0%   { transform: rotateX(0deg) rotateY(0deg) scale(1); filter: saturate(1); }
  18%  { transform: rotateX(210deg) rotateY(260deg) scale(1.06); }
  55%  { transform: rotateX(520deg) rotateY(640deg) scale(1.06); filter: saturate(1.08); }
  100% { transform: rotateX(820deg) rotateY(920deg) scale(1); filter: saturate(1); }
}
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 0 rgba(88,170,255,0); }
  50%     { box-shadow: 0 0 26px rgba(88,170,255,.22); }
}
.ball.spinning{
  animation:
    spin3dPro 1.25s cubic-bezier(.15,.85,.18,1),
    glowPulse 1.25s ease;
}

    /* Modal */
    .modalBack{
      position:fixed; inset:0;
      display:none; align-items:center; justify-content:center;
      padding: 18px;
      background: rgba(0,0,0,.62);
    }
    .modal{
      width: min(600px, 100%);
      border-radius: 20px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 18px;
    }
    .modalTop{ display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
    .modalTitle{
      margin:0;
      font-size: 18px;
      font-weight: 950;
      letter-spacing: .2px;
      text-transform: uppercase;
    }
    .modalBadge{
      display:inline-flex; align-items:center; gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      font-size: 12px;
      color: rgba(255,255,255,.85);
      white-space: nowrap;
    }
    .modalBig{ margin: 12px 0 6px; font-size: 28px; font-weight: 950; letter-spacing: .2px; }
    .modalLine{ margin: 6px 0; color: rgba(255,255,255,.88); line-height: 1.35; font-size: 14px; }
    .modalMeta{
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.12);
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(255,255,255,.70);
      font-size: 12px;
    }
    .btnRow{ display:flex; gap: 10px; margin-top: 14px; justify-content:flex-end; flex-wrap: wrap; }
    button{
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: #fff;
      font-weight: 900;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
      text-transform: uppercase;
      letter-spacing: .15px;
    }
    button:hover{ background: rgba(255,255,255,.14); transform: translateY(-1px); }
    button.primary{
      border-color: rgba(88,170,255,.34);
      background: rgba(88,170,255,.16);
    }
    button.primary:hover{ background: rgba(88,170,255,.22); }

    .errorText{ color: rgba(255,140,140,.98); font-weight: 900; }
    .warnText{ color: rgba(255,220,140,.98); font-weight: 900; }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="titleRow">
        <div>
          <h1>Money Madness</h1>
          <p class="sub">
            Pick any <b>blank</b> basketball. It spins, then reveals your bracket slot. Once claimed, it locks.
            After you claim, you’ll be auto-sent to the bracket with your spot highlighted.
          </p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a class="btn" href="./bracket.html">📋 View Bracket</a>
        </div>
      </div>

      <div class="panel">
        <div class="bar">
          <label>
            Your name
            <input id="playerName" placeholder="Type your name (required)" autocomplete="name" />
            <div class="hint">Use your real name so claims are easy to verify.</div>
          </label>

          <label>
            Invite token
            <input id="token" placeholder="Auto-filled from your link" autocomplete="off" />
            <div class="hint">Use your unique invite link so the token fills automatically.</div>
          </label>
        </div>

        <div class="statusLine">
          <div class="pill" id="status">Loading balls…</div>
          <div class="pill" id="lastUpdated"><small>Last updated:</small> —</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap" style="padding-top: 10px;">
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalTop">
        <h2 class="modalTitle" id="modalTitle">Result</h2>
        <div class="modalBadge">🏀 Money Madness</div>
      </div>

      <div class="modalBig" id="modalBig"></div>
      <div class="modalLine" id="modalLine1"></div>
      <div class="modalLine" id="modalLine2"></div>

      <div class="modalMeta" id="modalMeta"></div>

      <div class="btnRow">
        <button id="closeBtn">Close</button>
        <button class="primary" id="viewBracketBtn">View Bracket</button>
        <button class="primary" id="refreshBtn">Refresh Board</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBXm6hLez-U4w2FF5bUtDfaxLlgLFtAGzp4z24IaBdwSEtHBySIKY9-zrow0rUQw/exec";

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const tokenEl = document.getElementById("token");
    const playerEl = document.getElementById("playerName");

    const modalBack = document.getElementById("modalBack");
    const modalTitle = document.getElementById("modalTitle");
    const modalBig = document.getElementById("modalBig");
    const modalLine1 = document.getElementById("modalLine1");
    const modalLine2 = document.getElementById("modalLine2");
    const modalMeta = document.getElementById("modalMeta");

    document.getElementById("closeBtn").onclick = () => hideModal();
    document.getElementById("refreshBtn").onclick = async () => { hideModal(); await loadState(); };
    document.getElementById("viewBracketBtn").onclick = () => goToBracket();

    let balls = [];
    let busy = false;

    async function api(action, payload = {}) {
      const formData = new URLSearchParams({ action, ...payload });
      const res = await fetch(SCRIPT_URL, { method: "POST", body: formData });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { ok: false, error: "Non-JSON response: " + text.slice(0, 250) }; }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setStatusCounter(extra) {
      const claimed = balls.filter(b => b.isClaimed).length;
      const available = 68 - claimed;

      const a = extra?.gameActive;
      const l = extra?.lockClaims;

      let flags = "";
      if (a === false) flags += ` <span class="warnText">• Game is OFF</span>`;
      if (l === true)  flags += ` <span class="warnText">• Claims Locked</span>`;

      statusEl.innerHTML = `<b>${claimed}</b> of <b>68</b> balls claimed <span style="opacity:.6">•</span> <b>${available}</b> available${flags}`;
      lastUpdatedEl.innerHTML = `<small>Last updated:</small> ${new Date().toLocaleTimeString()}`;
    }

    async function loadState() {
      try {
        statusEl.textContent = "Loading balls…";
        const data = await api("getState");

        if (!data.ok) {
          statusEl.innerHTML = `<span class="errorText">API error: ${escapeHtml(data.error || "Unknown error")}</span>`;
          return;
        }

        balls = shuffle((data.balls || []).slice());
        renderGrid();
        setStatusCounter({ gameActive: data.gameActive, lockClaims: data.lockClaims });
      } catch (err) {
        statusEl.innerHTML = `<span class="errorText">Could not reach API. Check SCRIPT_URL + deployment.</span>`;
      }
    }

    function renderGrid() {
      grid.innerHTML = "";
      balls.forEach(b => {
        const div = document.createElement("div");
        div.className = "ball" + (b.isClaimed ? " taken" : "");
        div.dataset.ball = b.ballNumber;

        if (b.isClaimed) {
          const lock = document.createElement("div");
          lock.className = "lockOverlay";
          lock.textContent = "🔒";
          div.appendChild(lock);
        }

        div.onclick = (ev) => claimBall(b, ev.currentTarget);
        grid.appendChild(div);
      });
    }

    function showModal({ title, big, line1, line2, metaHtml, isError=false }) {
      modalTitle.textContent = title || "Result";
      modalBig.innerHTML = big || "";
      modalLine1.innerHTML = line1 || "";
      modalLine2.innerHTML = line2 || "";
      modalMeta.innerHTML = metaHtml || "";
      modalBig.classList.toggle("errorText", !!isError);
      modalBack.style.display = "flex";
      modalBack.setAttribute("aria-hidden", "false");
    }

    function hideModal() {
      modalBack.style.display = "none";
      modalBack.setAttribute("aria-hidden", "true");
    }

    function confettiBurst() {
      if (typeof confetti !== "function") return;
      confetti({ particleCount: 110, spread: 70, startVelocity: 42, origin: { y: 0.68 } });
      setTimeout(() => confetti({ particleCount: 70, spread: 100, startVelocity: 38, origin: { y: 0.62 } }), 140);
    }

    function goToBracket() {
      if (window.__lastClaim) {
        const { token, slot, ball } = window.__lastClaim;
        const qs = new URLSearchParams({ token, slot, ball });
        location.href = "./bracket.html?" + qs.toString();
      } else {
        location.href = "./bracket.html";
      }
    }

    async function claimBall(ball, el) {
      if (busy) return;
      if (ball.isClaimed) return;

      const token = tokenEl.value.trim();
      const name = playerEl.value.trim();

      if (!name || !token) {
        showModal({
          title: "Missing info",
          big: "Enter your name + token",
          line1: "Please fill both fields before selecting a ball.",
          line2: "",
          metaHtml: "",
          isError: true
        });
        return;
      }

      busy = true;
      el.classList.add("spinning");
      await new Promise(r => setTimeout(r, 850));

      const result = await api("claimBall", {
        token: token,
        playerName: name,
        ballNumber: String(ball.ballNumber)
      });

      await new Promise(r => setTimeout(r, 250));
      el.classList.remove("spinning");

      if (!result.ok) {
        showModal({
          title: "Not claimed",
          big: escapeHtml(result.error || "Something went wrong"),
          line1: "Try another available ball.",
          line2: "",
          metaHtml: "",
          isError: true
        });
        busy = false;
        await loadState();
        return;
      }

      const c = result.claim;
      window.__lastClaim = { token, slot: String(c.bracketSlot || ""), ball: String(c.ballNumber || "") };

      confettiBurst();

      showModal({
        title: "Ball claimed!",
        big: `🎉 Locked in`,
        line1: `<b>Bracket Slot:</b> ${escapeHtml(String(c.bracketSlot))} <span style="opacity:.7">•</span> ${escapeHtml(String(c.region))} <span style="opacity:.7">•</span> Seed ${escapeHtml(String(c.seed))}`,
        line2: `Tap “View Bracket” to see your name filled in.`,
        metaHtml: `
          <div><b>Time</b> ${escapeHtml(String(c.claimedAt))}</div>
        `,
        isError: false
      });

      busy = false;
      await loadState();

      setTimeout(goToBracket, 650);
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }

    (function init() {
      const params = new URLSearchParams(location.search);
      const t = params.get("token");
      if (t) tokenEl.value = t;

      loadState();
      setInterval(loadState, 12000);
    })();

    modalBack.addEventListener("click", (e) => {
      if (e.target === modalBack) hideModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBack.style.display === "flex") hideModal();
    });
  </script>
</body>
</html>
