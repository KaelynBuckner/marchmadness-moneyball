<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Madness</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b1220;color:#eef3ff}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
    h1{margin:0 0 6px;font-size:42px}
    .muted{opacity:.75;font-size:14px}
    .card{margin-top:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:900px){.row{grid-template-columns:1fr}}
    label{display:block;margin:0 0 6px;font-size:13px;opacity:.8;font-weight:700}
    input{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:#fff}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
    a{color:#93c5fd;text-decoration:none;font-weight:800}
    .chip{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-weight:800;font-size:13px;opacity:.9}
    .grid{display:grid;grid-template-columns:repeat(14,1fr);gap:10px;margin-top:14px}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(10,1fr)}}
    @media(max-width:640px){.grid{grid-template-columns:repeat(7,1fr)}}
    .ball{height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg,#ffb07a,#d36b35);
      display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-weight:900;color:rgba(0,0,0,.6)}
    .ball.taken{opacity:.28;cursor:not-allowed}
    .status{margin-top:12px;font-size:13px;opacity:.85;min-height:18px;white-space:pre-wrap}
    /* modal */
    .back{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.65)}
    .modal{width:min(520px,100%);background:#0f1a33;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px}
    .modal h2{margin:0 0 6px;font-size:18px}
    .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
    button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.10);color:#eef3ff;font-weight:900;padding:10px 12px;border-radius:14px;cursor:pointer}
    .primary{background:linear-gradient(180deg,#4aa3ff,#2a78d2)}
    .primary:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Money Madness</h1>
    <div class="muted">Pick any <b>blank</b> basketball. Once claimed, it locks.</div>

    <div class="card">
      <div class="row">
        <div>
          <label>Your name</label>
          <input id="name" placeholder="Type your name (required)" />
        </div>
        <div>
          <label>Invite token</label>
          <input id="token" placeholder="Auto-filled from your link" />
        </div>
      </div>

      <div class="topbar">
        <a href="?page=bracket" target="_top">📋 View Bracket</a>
        <div class="chip" id="countChip">Loading balls…</div>
        <div class="chip" id="updatedChip">Last updated: —</div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="back" id="modalBack">
    <div class="modal">
      <h2>Confirm your pick</h2>
      <div class="muted" id="modalText">—</div>
      <div class="btns">
        <button id="cancelBtn">Cancel</button>
        <button class="primary" id="confirmBtn">Confirm</button>
      </div>
    </div>
  </div>

<script>
  // ✅ PASTE YOUR WEB APP /exec URL here
  const WEB_APP_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

  const nameEl = document.getElementById("name");
  const tokenEl = document.getElementById("token");
  const gridEl = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const countChip = document.getElementById("countChip");
  const updatedChip = document.getElementById("updatedChip");

  const modalBack = document.getElementById("modalBack");
  const modalText = document.getElementById("modalText");
  const cancelBtn = document.getElementById("cancelBtn");
  const confirmBtn = document.getElementById("confirmBtn");

  let pendingBallNumber = null;
  let busy = false;

  async function api(payload){
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function showModal(ballNumber){
    pendingBallNumber = ballNumber;
    modalText.textContent = `Confirm to lock in your pick. You will receive Ball #${ballNumber}.`;
    modalBack.style.display = "flex";
  }
  function hideModal(){
    pendingBallNumber = null;
    modalBack.style.display = "none";
  }

  function renderBalls(balls){
    gridEl.innerHTML = "";
    balls.forEach(b=>{
      const d = document.createElement("div");
      d.className = "ball" + (b.available ? "" : " taken");
      d.innerHTML = "<span>●</span>"; // blank look
      if (b.available){
        d.onclick = ()=>{
          if (busy) return;
          const name = nameEl.value.trim();
          const token = tokenEl.value.trim();
          if (!name || !token){
            statusEl.textContent = "Enter your name and token first.";
            return;
          }
          showModal(b.ballNumber);
        };
      }
      gridEl.appendChild(d);
    });
  }

  async function loadState(){
    try{
      const st = await api({ action:"getState" });
      if(!st.ok){
        statusEl.textContent = "API ERROR: " + (st.error || "Unknown");
        countChip.textContent = "Error";
        return;
      }
      const taken = st.balls.filter(x=>!x.available).length;
      countChip.textContent = `${taken}/${st.ballCount || 68} claimed`;
      updatedChip.textContent = "Last updated: " + new Date().toLocaleString();
      renderBalls(st.balls);
      statusEl.textContent = "";
    }catch(err){
      statusEl.textContent = "LOAD ERROR: " + String(err);
      countChip.textContent = "Error";
    }
  }

  async function confirmPick(){
    if (busy) return;
    if (!pendingBallNumber) return;

    busy = true;
    confirmBtn.disabled = true;

    try{
      statusEl.textContent = "Saving…";
      const out = await api({
        action:"pickBall",
        name: nameEl.value.trim(),
        token: tokenEl.value.trim(),
        ballNumber: pendingBallNumber
      });

      if(!out.ok){
        statusEl.textContent = "SAVE ERROR: " + (out.error || "Unknown");
        hideModal();
        await loadState();
        return;
      }

      statusEl.textContent = `Locked in! You got Ball #${pendingBallNumber}.`;
      hideModal();
      await loadState();

    }catch(err){
      statusEl.textContent = "SAVE ERROR: " + String(err);
      hideModal();
    }finally{
      busy = false;
      confirmBtn.disabled = false;
    }
  }

  // Auto-fill token from URL ?token=...
  (function init(){
    const params = new URLSearchParams(location.search);
    const t = params.get("token");
    if (t) tokenEl.value = t;

    loadState();
    setInterval(loadState, 10000);
  })();

  // Close modal by clicking outside + ESC
  modalBack.addEventListener("click", (e)=>{ if(e.target===modalBack) hideModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape" && modalBack.style.display==="flex") hideModal(); });

  cancelBtn.addEventListener("click", hideModal);
  confirmBtn.addEventListener("click", confirmPick);
</script>
</body>
</html>
