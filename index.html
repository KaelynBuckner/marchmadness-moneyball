<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness Ball Pick</title>

  <!-- Confetti (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{
      --bg0:#070b16;
      --bg1:#0b1226;
      --text:#ffffff;
      --muted:rgba(255,255,255,.75);
      --line:rgba(255,255,255,.12);
      --card:rgba(255,255,255,.07);
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --gap:14px;
      --ballSize:78px;
      --maxW:1100px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 15% 10%, rgba(255,140,40,.15), transparent 60%),
        radial-gradient(900px 650px at 85% 25%, rgba(88,170,255,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }
    header{
      padding: 28px 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }
    .wrap{
      max-width: var(--maxW);
      margin: 0 auto;
      padding: 18px 16px 40px;
    }
    .title{
      font-size: 44px;
      font-weight: 900;
      letter-spacing: .3px;
      margin: 0;
      line-height: 1.05;
      text-align:center;
    }
    .subtitle{
      margin: 10px auto 0;
      text-align:center;
      color: var(--muted);
      font-size: 14px;
      max-width: 820px;
    }
    .panel{
      margin-top: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
    }
    .bar{
      display:grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
      align-items:end;
    }
    @media (max-width: 700px){
      .bar{ grid-template-columns: 1fr; }
      .title{ font-size: 34px; }
      :root{ --ballSize: 72px; }
    }
    label{
      display:grid;
      gap:6px;
      font-size: 13px;
      color: rgba(255,255,255,.88);
    }
    input{
      height: 44px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: #fff;
      outline: none;
      font-size: 15px;
    }
    input::placeholder{ color: rgba(255,255,255,.55); }
    input:focus{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 0 0 4px rgba(255,140,40,.12);
    }
    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.62);
      margin-top: 2px;
    }
    .statusLine{
      margin-top: 12px;
      font-size: 14px;
      color: rgba(255,255,255,.85);
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
    }
    .small{
      font-size: 12px;
      color: rgba(255,255,255,.65);
    }
    .actions{
      margin-top: 10px;
      display:flex;
      justify-content:center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btnLink{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height: 40px;
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color:#fff;
      font-weight: 800;
      transition: transform .12s ease, background .12s ease;
    }
    .btnLink:hover{ background: rgba(255,255,255,.14); transform: translateY(-1px); }

    .grid{
      display:grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: var(--gap);
      padding: 16px 6px 6px;
      max-width: 980px;
      margin: 0 auto;
    }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 640px){ .grid{ grid-template-columns: repeat(4, 1fr); } }

    /* 3D Basketball */
    .ball{
      position: relative;
      height: var(--ballSize);
      width: 100%;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      transform-style: preserve-3d;
      perspective: 900px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), rgba(255,255,255,0) 38%),
        radial-gradient(circle at 60% 65%, rgba(0,0,0,.35), rgba(0,0,0,0) 46%),
        radial-gradient(circle at 50% 55%, #ff8a2b, #e85d00 62%, #b54000 100%);
      box-shadow:
        0 14px 26px rgba(0,0,0,.45),
        inset 0 10px 18px rgba(255,255,255,.15),
        inset 0 -14px 18px rgba(0,0,0,.28);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, opacity .18s ease;
      display:grid;
      place-items:center;
    }
    .ball::before{
      content:"";
      position:absolute; inset:0;
      border-radius:999px;
      background:
        radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.25) 46%, rgba(0,0,0,.25) 48%, transparent 49%),
        linear-gradient(90deg, transparent 47%, rgba(0,0,0,.28) 48%, rgba(0,0,0,.28) 52%, transparent 53%),
        linear-gradient(0deg, transparent 47%, rgba(0,0,0,.28) 48%, rgba(0,0,0,.28) 52%, transparent 53%);
      mix-blend-mode: multiply;
      opacity: .75;
      transform: translateZ(4px);
      pointer-events:none;
    }
    .ball::after{
      content:"";
      position:absolute; inset:1px;
      border-radius:999px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
      pointer-events:none;
    }
    .ball:hover{
      transform: translateY(-3px) rotateX(10deg) rotateY(-10deg);
      box-shadow:
        0 18px 40px rgba(0,0,0,.55),
        0 0 24px rgba(255,140,40,.22),
        inset 0 10px 18px rgba(255,255,255,.18),
        inset 0 -14px 18px rgba(0,0,0,.26);
    }
    .ball.taken{
      cursor:not-allowed;
      filter: grayscale(.9) brightness(.75);
      opacity: .55;
      transform: none;
    }
    .ball.taken:hover{ transform:none; }

    .lockOverlay{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      font-size: 22px;
      transform: translateZ(10px);
      pointer-events:none;
      opacity: .95;
      text-shadow: 0 8px 18px rgba(0,0,0,.55);
    }

    @keyframes spin3d {
      0%   { transform: rotateX(0deg) rotateY(0deg) scale(1); }
      35%  { transform: rotateX(180deg) rotateY(260deg) scale(1.06); }
      70%  { transform: rotateX(420deg) rotateY(520deg) scale(1.06); }
      100% { transform: rotateX(720deg) rotateY(720deg) scale(1); }
    }
    .ball.spinning{
      animation: spin3d 1.2s cubic-bezier(.2,.85,.2,1);
    }

    /* Modal */
    .modalBack{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background: rgba(0,0,0,.58);
    }
    .modal{
      width: min(560px, 100%);
      border-radius: 20px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 18px;
    }
    .modalTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .modalTitle{
      margin:0;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .2px;
    }
    .modalBadge{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      font-size: 12px;
      color: rgba(255,255,255,.85);
      white-space: nowrap;
    }
    .modalBig{
      margin: 12px 0 6px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .3px;
    }
    .modalLine{
      margin: 6px 0;
      color: rgba(255,255,255,.88);
      line-height: 1.35;
    }
    .modalMeta{
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.12);
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(255,255,255,.70);
      font-size: 12px;
    }
    .btnRow{
      display:flex;
      gap: 10px;
      margin-top: 14px;
      justify-content:flex-end;
      flex-wrap: wrap;
    }
    button{
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: #fff;
      font-weight: 750;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:hover{ background: rgba(255,255,255,.14); transform: translateY(-1px); }
    button.primary{
      border-color: rgba(255,140,40,.30);
      background: rgba(255,140,40,.18);
    }
    button.primary:hover{ background: rgba(255,140,40,.24); }

    .errorText{
      color: rgba(255,140,140,.95);
      font-weight: 650;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap" style="padding-bottom: 0;">
      <h1 class="title">Money Madness Ball Pick</h1>
      <div class="subtitle">
        Pick any <b>blank</b> basketball. It spins, then reveals your bracket position. Once claimed, it locks.
      </div>

      <div class="panel">
        <div class="bar">
          <label>
            Your name
            <input id="playerName" placeholder="Type your name (required)" autocomplete="name" />
            <div class="hint">Use your real name so claims are easy to verify.</div>
          </label>
          <label>
            Invite token
            <input id="token" placeholder="Auto-filled from your link" autocomplete="off" />
            <div class="hint">Use your unique invite link so the token fills automatically.</div>
          </label>
        </div>

        <div class="statusLine">
          <div class="pill" id="status">Loading balls…</div>
          <div class="pill small" id="lastUpdated">Last updated: —</div>
        </div>

        <div class="actions">
          <a class="btnLink" id="viewBracketLink" href="./bracket.html">📋 View Bracket</a>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalTop">
        <div>
          <h2 class="modalTitle" id="modalTitle">Result</h2>
        </div>
        <div class="modalBadge" id="modalBadge">🏀 Money Madness</div>
      </div>

      <div class="modalBig" id="modalBig"></div>
      <div class="modalLine" id="modalLine1"></div>
      <div class="modalLine" id="modalLine2"></div>

      <div class="modalMeta" id="modalMeta"></div>

      <div class="btnRow">
        <button id="closeBtn">Close</button>
        <button class="primary" id="goBracketBtn">Go to bracket</button>
        <button class="primary" id="refreshBtn">Refresh board</button>
      </div>
    </div>
  </div>

  <script>
    // =========================
    // PASTE YOUR LATEST Apps Script Web App /exec URL HERE
    // (This MUST be the latest deployment, not the old one.)
    // =========================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBXm6hLez-U4w2FF5bUtDfaxLlgLFtAGzp4z24IaBdwSEtHBySIKY9-zrow0rUQw/exec";

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const tokenEl = document.getElementById("token");
    const playerEl = document.getElementById("playerName");
    const viewBracketLink = document.getElementById("viewBracketLink");

    const modalBack = document.getElementById("modalBack");
    const modalTitle = document.getElementById("modalTitle");
    const modalBig = document.getElementById("modalBig");
    const modalLine1 = document.getElementById("modalLine1");
    const modalLine2 = document.getElementById("modalLine2");
    const modalMeta = document.getElementById("modalMeta");

    document.getElementById("closeBtn").onclick = () => hideModal();
    document.getElementById("refreshBtn").onclick = async () => { hideModal(); await loadState(); };

    // "Go to bracket" button (gets set after a claim)
    const goBracketBtn = document.getElementById("goBracketBtn");
    let lastBracketUrl = "./bracket.html";
    goBracketBtn.onclick = () => { window.location.href = lastBracketUrl; };

    let balls = [];
    let busy = false;

    // Avoid CORS preflight by sending URL-encoded body (no JSON header)
    async function api(action, payload = {}) {
      const formData = new URLSearchParams({ action, ...payload });
      const res = await fetch(SCRIPT_URL, { method: "POST", body: formData });
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { ok: false, error: "Non-JSON response from Apps Script: " + text.slice(0,200) }; }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function setStatusCounter() {
      const claimed = balls.filter(b => b.isClaimed).length;
      const available = 68 - claimed;
      statusEl.innerHTML = `<b>${claimed}</b> of <b>68</b> balls claimed <span style="opacity:.6">•</span> <b>${available}</b> available`;
      lastUpdatedEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    function normalizeSlot(slot) {
      return String(slot || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "")
        .replace(/^SOUTH/, "S")
        .replace(/^EAST/, "E")
        .replace(/^WEST/, "W")
        .replace(/^MIDWEST/, "M")
        .replace(/[^A-Z0-9]/g, "")
        .replace(/^([EWMS])0+/, "$1"); // E01 -> E1
    }

    async function loadState() {
      try {
        statusEl.textContent = "Loading balls…";

        // quick health check (optional but helpful)
        // const health = await fetch(SCRIPT_URL + "?format=json").then(r=>r.text()).catch(()=>null);

        const data = await api("getState");
        if (!data.ok) {
          statusEl.innerHTML = `<span class="errorText">API error: ${data.error || "Unknown error"}</span>`;
          return;
        }

        balls = shuffle((data.balls || []).slice());
        renderGrid();
        setStatusCounter();

        // Keep "View Bracket" link carrying token (so My Picks can highlight)
        const t = tokenEl.value.trim();
        viewBracketLink.href = t ? `./bracket.html?token=${encodeURIComponent(t)}` : "./bracket.html";

      } catch (err) {
        statusEl.innerHTML = `<span class="errorText">Could not reach API. Check SCRIPT_URL and deployment.</span>`;
      }
    }

    function renderGrid() {
      grid.innerHTML = "";

      balls.forEach(b => {
        const div = document.createElement("div");
        div.className = "ball" + (b.isClaimed ? " taken" : "");
        div.dataset.ball = b.ballNumber;

        if (b.isClaimed) {
          const lock = document.createElement("div");
          lock.className = "lockOverlay";
          lock.textContent = "🔒";
          div.appendChild(lock);
        }

        div.onclick = (ev) => claimBall(b, ev.currentTarget);
        grid.appendChild(div);
      });
    }

    function showModal({ title, big, line1, line2, metaHtml, isError=false }) {
      modalTitle.textContent = title || "Result";
      modalBig.innerHTML = big || "";
      modalLine1.innerHTML = line1 || "";
      modalLine2.innerHTML = line2 || "";
      modalMeta.innerHTML = metaHtml || "";
      if (isError) modalBig.classList.add("errorText");
      else modalBig.classList.remove("errorText");
      modalBack.style.display = "flex";
      modalBack.setAttribute("aria-hidden", "false");
    }

    function hideModal() {
      modalBack.style.display = "none";
      modalBack.setAttribute("aria-hidden", "true");
    }

    function confettiBurst() {
      if (typeof confetti !== "function") return;
      confetti({ particleCount: 110, spread: 70, startVelocity: 42, origin: { y: 0.68 } });
      setTimeout(() => confetti({ particleCount: 70, spread: 100, startVelocity: 38, origin: { y: 0.62 } }), 140);
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }

    async function claimBall(ball, el) {
      if (busy) return;
      if (ball.isClaimed) return;

      const token = tokenEl.value.trim();
      const name = playerEl.value.trim();

      if (!name || !token) {
        showModal({
          title: "Missing info",
          big: "Enter your name + token",
          line1: "Please fill both fields before selecting a ball.",
          line2: "If you don’t have a token link, ask the organizer.",
          metaHtml: "",
          isError: true
        });
        return;
      }

      busy = true;
      el.classList.add("spinning");
      await new Promise(r => setTimeout(r, 850));

      const result = await api("claimBall", {
        token: token,
        playerName: name,
        ballNumber: String(ball.ballNumber)
      });

      await new Promise(r => setTimeout(r, 250));
      el.classList.remove("spinning");

      if (!result.ok) {
        showModal({
          title: "Not claimed",
          big: result.error || "Something went wrong",
          line1: "Try another available ball.",
          line2: "",
          metaHtml: "",
          isError: true
        });
        busy = false;
        await loadState();
        return;
      }

      // Success
      const c = result.claim || {};
      const slot = normalizeSlot(c.bracketSlot);
      const t = token;
      // After success:
      const slot = String(c.bracketSlot || "");
      const t = encodeURIComponent(token);
      const s = encodeURIComponent(slot);
      setTimeout(() => {
      window.location.href = `./bracket.html?token=${t}&slot=${s}`;
      }, 900);
      
      confettiBurst();

      // Build bracket redirect URL with token + slot (so bracket can highlight + My Picks)
      lastBracketUrl = `./bracket.html?token=${encodeURIComponent(t)}&slot=${encodeURIComponent(slot)}&ball=${encodeURIComponent(String(c.ballNumber || ""))}`;

      // Also update the top "View Bracket" link
      viewBracketLink.href = lastBracketUrl;

      showModal({
        title: "Ball claimed!",
        big: `🎉 You claimed a ball`,
        line1: `<b>Bracket Slot:</b> ${escapeHtml(slot)} <span style="opacity:.7">•</span> Seed ${escapeHtml(String(c.seed ?? ""))} <span style="opacity:.7">•</span> ${escapeHtml(String(c.region ?? ""))}`,
        line2: `Next: we’ll take you to the bracket so you can see your name in place.`,
        metaHtml: `
          <div><b>Ball #</b> ${escapeHtml(String(c.ballNumber || ""))}</div>
          <div><b>Time</b> ${escapeHtml(String(c.claimedAt || ""))}</div>
        `,
        isError: false
      });

      // Auto-jump to bracket after a short beat (feels premium)
      setTimeout(() => {
        window.location.href = lastBracketUrl;
      }, 1200);

      busy = false;
      await loadState();
    }

    // Auto-fill token from URL ?token=...
    (function init() {
      const params = new URLSearchParams(location.search);
      const t = params.get("token");
      if (t) tokenEl.value = t;

      // Keep view bracket link carrying token
      viewBracketLink.href = t ? `./bracket.html?token=${encodeURIComponent(t)}` : "./bracket.html";

      loadState();
      setInterval(loadState, 10000);
    })();

    modalBack.addEventListener("click", (e) => {
      if (e.target === modalBack) hideModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBack.style.display === "flex") hideModal();
    });
  </script>
</body>
</html>
