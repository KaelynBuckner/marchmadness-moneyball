<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Madness</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#111827;
  color:white;
  text-align:center;
  margin:0;
}

h1 { margin-top:20px; }

#status {
  margin:15px 0;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:14px;
  max-width:980px;
  margin:0 auto 40px auto;
  padding: 10px 14px 30px;
}

.ball{
  position:relative;
  height:78px;
  border-radius:999px;
  cursor:pointer;
  user-select:none;

  /* 3D depth */
  transform-style:preserve-3d;
  perspective:900px;

  /* pro look */
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), rgba(255,255,255,0) 38%),
    radial-gradient(circle at 60% 65%, rgba(0,0,0,.35), rgba(0,0,0,0) 46%),
    radial-gradient(circle at 50% 55%, #ff8a2b, #e85d00 62%, #b54000 100%);
  box-shadow:
    0 14px 26px rgba(0,0,0,.45),
    inset 0 10px 18px rgba(255,255,255,.15),
    inset 0 -14px 18px rgba(0,0,0,.28);
  transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
}

.ball::before{
  /* basketball seams */
  content:"";
  position:absolute; inset:0;
  border-radius:999px;
  background:
    radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.25) 46%, rgba(0,0,0,.25) 48%, transparent 49%),
    linear-gradient(90deg, transparent 47%, rgba(0,0,0,.28) 48%, rgba(0,0,0,.28) 52%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(0,0,0,.28) 48%, rgba(0,0,0,.28) 52%, transparent 53%);
  mix-blend-mode:multiply;
  opacity:.75;
  transform: translateZ(4px);
}

.ball::after{
  /* outer rim highlight */
  content:"";
  position:absolute; inset:1px;
  border-radius:999px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
  pointer-events:none;
}

.ball:hover{
  transform: translateY(-3px) rotateX(10deg) rotateY(-10deg);
  box-shadow:
    0 18px 40px rgba(0,0,0,.55),
    0 0 24px rgba(255,140,40,.22),
    inset 0 10px 18px rgba(255,255,255,.18),
    inset 0 -14px 18px rgba(0,0,0,.26);
}

.ball.taken{
  cursor:not-allowed;
  filter: grayscale(.9) brightness(.75);
  opacity:.5;
  transform:none;
}

.ball.taken:hover{
  box-shadow:
    0 14px 26px rgba(0,0,0,.45),
    inset 0 10px 18px rgba(255,255,255,.10),
    inset 0 -14px 18px rgba(0,0,0,.28);
}

.ball:hover {
  transform:scale(1.05);
}

.ball.taken {
  background:#444;
  cursor:not-allowed;
  opacity:0.5;
}

input {
  padding:8px;
  margin:5px;
}
button {
  padding:8px 12px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Money Madness Ball Pick</h1>

<div>
  <input id="playerName" placeholder="Your Name">
  <input id="token" placeholder="Invite Token">
</div>

<div id="status">Loading balls...</div>

<div class="grid" id="grid"></div>

<script>

// 🔴 REPLACE THIS WITH YOUR APPS SCRIPT WEB APP URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxpgOnW7LSLVSLeasybA12MpZgcNi_OVP8CvZwATkwEywxhTqVyQOVEMLAlNH-4_s/exec";

// helper
async function api(action, payload = {}) {
  const formData = new URLSearchParams({ action, ...payload });

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: formData
  });

  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    return { ok: false, error: "Non-JSON response from Apps Script: " + text };
  }
}
  
let balls = [];

function shuffle(array) {
  for (let i=array.length-1; i>0; i--) {
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

async function loadState() {
  const data = await api("getState");
  if(!data.ok){
    document.getElementById("status").innerText="Error loading.";
    return;
  }

  balls = shuffle(data.balls.slice());
  renderGrid();

  const claimed = balls.filter(b=>b.isClaimed).length;
  const available = 68-claimed;

  document.getElementById("status").innerHTML =
    "<b>"+claimed+"</b> of 68 balls claimed • <b>"+available+"</b> available";
}

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML="";

  balls.forEach(b=>{
    const div=document.createElement("div");
    div.className="ball"+(b.isClaimed?" taken":"");
    div.innerText="🏀";

    div.onclick=()=>claimBall(b);
    grid.appendChild(div);
  });
}

async function claimBall(ball){
  if(ball.isClaimed) return;

  const token=document.getElementById("token").value.trim();
  const name=document.getElementById("playerName").value.trim();

  if(!token||!name){
    alert("Enter name and token first.");
    return;
  }

  const result=await api("claimBall",{
    token:token,
    playerName:name,
    ballNumber:ball.ballNumber
  });

  if(!result.ok){
    alert(result.error);
    loadState();
    return;
  }

  alert(
    "You got Ball #"+result.claim.ballNumber+
    "\nRegion: "+result.claim.region+
    "\nSeed: "+result.claim.seed+
    "\nSlot: "+result.claim.bracketSlot
  );

  loadState();
}

loadState();

</script>

</body>
</html>
