<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#0c1220;
font-family:Arial;
color:white;
text-align:center;
padding:30px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

input{
padding:10px;
margin:8px;
border-radius:8px;
border:none;
width:200px;
}

.grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:10px;
margin-top:30px;
}

.ball{

background:orange;
border-radius:50%;
width:60px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
color:black;

}

.taken{
background:#444;
cursor:not-allowed;
}

</style>

</head>

<body>

<h1>March Madness Moneyball</h1>

<input id="name" placeholder="Your Name">

<br>

<input id="token" placeholder="Your Token">

<div class="grid" id="balls"></div>

<br><br>

<a href="?page=bracket" style="color:white;">View Live Bracket</a>

<script>

const grid=document.getElementById("balls");

const nameInput=document.getElementById("name");
const tokenInput=document.getElementById("token");

async function api(data){

const res=await fetch(location.href,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

return res.json();

}

async function load(){

const state=await api({action:"getState"});

grid.innerHTML="";

state.balls.forEach(b=>{

const div=document.createElement("div");

div.className="ball";

if(!b.available) div.classList.add("taken");

div.innerHTML="";

if(b.available){

div.onclick=()=>pick(b.number);

}

grid.appendChild(div);

});

}

async function pick(number){

const name=nameInput.value;
const token=tokenInput.value;

if(!name || !token){

alert("Enter name and token");

return;

}

const res=await api({
action:"pickBall",
name:name,
token:token,
ball:number
});

if(!res.ok){

alert(res.error);
return;

}

alert("Ball selected!");

load();

}

load();

</script>

</body>
</html>
