<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Board</title>

  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0b1220;
      --bg2:#0b1935;
      --glass: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.14);
      --text: #eef3ff;
      --muted: rgba(238,243,255,.72);
      --blue: #4aa3ff;
      --shadow: 0 26px 90px rgba(0,0,0,.45);
      --radius: 22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 15% 18%, rgba(255,120,80,.18), transparent 60%),
        radial-gradient(900px 520px at 78% 22%, rgba(70,160,255,.16), transparent 58%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 30%, var(--bg2));
      min-height:100vh;
    }
    .wrap{ max-width: 1240px; margin:0 auto; padding: 34px 18px 70px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    h1{ margin:0; font-size: 22px; letter-spacing:.2px; }
    a{
      color: var(--text);
      text-decoration:none;
      font-weight: 900;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
    }
    .card{
      margin-top: 16px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(90deg, rgba(255,255,255,.07), rgba(255,255,255,.05));
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .bar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-bottom: 10px;
    }
    .chip{
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(238,243,255,.85);
      font-weight: 900;
      font-size: 13px;
    }
    input{
      width: min(320px, 100%);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.22);
      color: var(--text);
      outline:none;
      font-size: 14px;
    }
    table{ width:100%; border-collapse:collapse; overflow:hidden; border-radius: 16px; }
    th, td{
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      text-align:left;
      font-size: 13px;
    }
    th{ color: rgba(238,243,255,.78); font-weight: 1000; letter-spacing:.2px; }
    tr:hover td{ background: rgba(255,255,255,.04); }
    .muted{ margin-top: 10px; color: var(--muted); font-weight: 800; font-size: 13px; white-space:pre-wrap; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <h1>Live Board</h1>
      <a href="./">← Back</a>
    </div>

    <div class="card">
      <div class="bar">
        <div class="chip" id="countChip">Loading…</div>
        <input id="filter" placeholder="Search name or token…" />
        <div class="chip" id="updatedChip">Last updated: —</div>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:44%">Name</th>
            <th style="width:36%">Token</th>
            <th style="width:20%">Ball #</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="muted" id="status">Loading…</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlQ91quFkT2XA98MusdUMtvh6heIQKxzjpF2vkvfxmoc7vPLUvChIQoqHax2l5r-I/exec";
    const BALL_COUNT = 68;

    const rowsEl = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    const countChip = document.getElementById("countChip");
    const updatedChip = document.getElementById("updatedChip");
    const filterEl = document.getElementById("filter");

    let allPicks = [];

    function jsonp(params) {
      return new Promise((resolve, reject) => {
        const cb = "mm_cb_" + Math.random().toString(16).slice(2);
        const url = new URL(WEB_APP_URL);
        Object.entries({ ...params, callback: cb }).forEach(([k,v]) => url.searchParams.set(k, v));

        const script = document.createElement("script");
        const timer = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);

        function cleanup(){
          clearTimeout(timer);
          delete window[cb];
          script.remove();
        }

        window[cb] = (data) => { cleanup(); resolve(data); };
        script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function esc(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function stamp(){
      return new Date().toLocaleString();
    }

    function render(){
      const q = filterEl.value.trim().toLowerCase();
      const picks = !q ? allPicks : allPicks.filter(p =>
        String(p.name).toLowerCase().includes(q) || String(p.token).toLowerCase().includes(q)
      );

      rowsEl.innerHTML = "";
      picks.forEach(p=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(p.name)}</td><td>${esc(p.token)}</td><td>${p.ballNumber}</td>`;
        rowsEl.appendChild(tr);
      });

      statusEl.textContent = `Showing ${picks.length} of ${allPicks.length} picks. Refreshing every 10 seconds.`;
    }

    async function load(){
      try{
        const st = await jsonp({ action:"getState" });
        if(!st.ok){
          countChip.textContent = "API error";
          statusEl.textContent = "API ERROR: " + (st.error || "Unknown");
          return;
        }

        allPicks = st.picks || [];
        const taken = (st.balls || []).filter(x=>!x.available).length;

        countChip.textContent = `${taken}/${st.ballCount || BALL_COUNT} claimed`;
        updatedChip.textContent = `Last updated: ${stamp()}`;

        render();
      }catch(err){
        countChip.textContent = "Load error";
        statusEl.textContent = String(err);
      }
    }

    filterEl.addEventListener("input", render);

    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
