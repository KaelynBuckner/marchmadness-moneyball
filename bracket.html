<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Bracket</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b1220;color:#eef3ff;padding:28px 16px 60px}
    .wrap{max-width:1100px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{margin:0;font-size:22px}
    a{color:#93c5fd;text-decoration:none;font-weight:900}
    .card{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.10);text-align:left;font-size:13px}
    th{opacity:.8;font-weight:900}
    .muted{opacity:.75;font-size:13px;margin-top:10px;font-weight:800}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Live Picks</h1>
      <a href="?page=index" target="_top">← Back</a>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Token</th><th>Ball #</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="muted" id="status">Loading…</div>
    </div>
  </div>

<script>
  // ✅ PASTE YOUR WEB APP /exec URL here (same as index.html)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzlQ91quFkT2XA98MusdUMtvh6heIQKxzjpF2vkvfxmoc7vPLUvChIQoqHax2l5r-I/exec";

  const rowsEl = document.getElementById("rows");
  const statusEl = document.getElementById("status");

  async function api(payload){
    const res = await fetch(WEB_APP_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  async function load(){
    try{
      const st = await api({ action:"getState" });
      if(!st.ok){ statusEl.textContent = st.error || "Error"; return; }
      rowsEl.innerHTML = "";
      st.picks.forEach(p=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${esc(p.name)}</td><td>${esc(p.token)}</td><td>${p.ballNumber}</td>`;
        rowsEl.appendChild(tr);
      });
      statusEl.textContent = `Loaded ${st.picks.length} picks. Refreshing every 10 seconds.`;
    }catch(err){
      statusEl.textContent = String(err);
    }
  }

  load();
  setInterval(load, 10000);
</script>
</body>
</html>
