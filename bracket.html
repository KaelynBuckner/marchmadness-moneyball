<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Money Madness — Live Bracket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07162f; --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff; --muted:#9db7e6;
      --blue:#2a66ff; --orange:#ff7a00;
      --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.28), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    .wrap{max-width:1600px;margin:0 auto;padding:18px}
    .topbar{
      display:flex;gap:14px;align-items:center;justify-content:space-between;
      padding:14px 16px;border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(10px);
      position:sticky; top:12px; z-index:50;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--blue));position:relative;overflow:hidden;box-shadow:0 12px 22px rgba(0,0,0,.35)}
    .mark:after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 55%);transform:rotate(20deg)}
    .brand h1{margin:0;font-family:Oswald,Inter,sans-serif;letter-spacing:.6px;font-size:22px;line-height:1}
    .sub{margin-top:2px;color:var(--muted);font-size:12px;font-weight:800}

    .btn{
      border:none;border-radius:14px;padding:11px 14px;color:white;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,var(--orange),#ff4d00);
      box-shadow:0 12px 26px rgba(255,122,0,.22);
      user-select:none;
    }
    .btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--stroke);box-shadow:none}
    .pill{display:flex;gap:10px;align-items:center;padding:10px 12px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-radius:999px;justify-content:center}
    .pill span{color:var(--muted);font-size:12px;font-weight:900}
    .pill b{font-family:Oswald,Inter,sans-serif;letter-spacing:.4px}

    /* Zoom canvas */
    .viewer{
      margin-top:16px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      height: calc(100vh - 130px);
      position:relative;
    }
    .viewerHint{
      position:absolute; left:14px; bottom:14px;
      padding:10px 12px;border-radius:14px;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.12);
      color:var(--muted); font-weight:900; font-size:12px;
      backdrop-filter: blur(10px);
      pointer-events:none;
    }
    .viewport{
      width:100%; height:100%;
      overflow:hidden;
      cursor:grab;
      touch-action:none; /* better pan/zoom on mobile */
    }
    .viewport.dragging{cursor:grabbing}
    .content{
      transform-origin: 0 0;
      will-change: transform;
      padding:16px;
      /* Make it “big” so zooming out shows the full tournament area */
      min-width: 1500px;
    }

    .bracketGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:16px;
    }
    @media (max-width:1100px){
      .bracketGrid{grid-template-columns:1fr;}
      .content{min-width: 900px;}
    }

    .regionCard{
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);
      overflow:hidden;
    }
    .regionHead{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);
    }
    .regionHead h2{margin:0;font-family:Oswald,Inter,sans-serif;letter-spacing:.5px}
    .regionBody{padding:14px 16px}

    .roundTitle{
      color:var(--muted);
      font-size:12px;font-weight:900;
      margin:10px 0 8px;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .games{display:grid; gap:10px}
    .game{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      border-radius:14px;
      padding:10px;
    }
    .line{
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
      padding:7px 8px;
      border-radius:10px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      margin-bottom:7px;
    }
    .line:last-child{margin-bottom:0}
    .left{display:flex;align-items:center;gap:10px;min-width:0}
    .seed{font-family:Oswald,Inter,sans-serif;width:28px;text-align:center;opacity:.9}
    .team{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .owner{color:var(--muted);font-size:12px;font-weight:900;white-space:nowrap;margin-left:10px;opacity:.95}
    .score{font-family:Oswald,Inter,sans-serif;opacity:.9;min-width:22px;text-align:right}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>LIVE BRACKET</h1>
          <div class="sub">Zoom + pan • Teams + owners update automatically</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <div class="pill"><span>LAST UPDATE</span><b id="lastUpdate">—</b></div>
        <button class="btn secondary" id="pollBtn">Poll Now</button>
        <button class="btn secondary" id="zoomOut">−</button>
        <button class="btn secondary" id="zoomIn">+</button>
        <button class="btn secondary" id="zoomReset">Reset</button>
        <button class="btn" onclick="location.href='index.html'">Pick Page</button>
      </div>
    </div>

    <div class="viewer">
      <div class="viewport" id="viewport">
        <div class="content" id="content">
          <div class="bracketGrid" id="bracketGrid"></div>
        </div>
      </div>
      <div class="viewerHint">Drag to pan • Ctrl+Scroll to zoom • Buttons to zoom/reset</div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const POLL_MS = 10000;

    const el = (id)=>document.getElementById(id);

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);
        window[cb] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
        function cleanup(){ try{ delete window[cb]; }catch{} script.remove(); }
        script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error("JSONP load error")); };

        document.head.appendChild(script);
      });
    }

    function normTeam(t){ return String(t||"").trim().toLowerCase(); }
    function groupBy(arr, keyFn){
      const m = new Map();
      arr.forEach(x => {
        const k = keyFn(x);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(x);
      });
      return m;
    }

    function renderRegion(regionName, gamesByRound, ownedMap){
      const card = document.createElement("div");
      card.className = "regionCard";

      const head = document.createElement("div");
      head.className = "regionHead";
      head.innerHTML = `<h2>${escapeHtml(regionName || "Region")}</h2>`;
      card.appendChild(head);

      const body = document.createElement("div");
      body.className = "regionBody";

      const roundOrder = [1,2,3,4];
      const roundLabel = {1:"Round of 64",2:"Round of 32",3:"Sweet 16",4:"Elite 8"};

      roundOrder.forEach(r => {
        const list = gamesByRound.get(r) || [];
        if (!list.length) return;

        const title = document.createElement("div");
        title.className = "roundTitle";
        title.textContent = roundLabel[r] || ("Round " + r);
        body.appendChild(title);

        const gamesWrap = document.createElement("div");
        gamesWrap.className = "games";

        list.forEach(g => {
          const homeTeam = g.homeTeam || "TBD";
          const awayTeam = g.awayTeam || "TBD";
          const hs = (g.homeScore ?? "");
          const as = (g.awayScore ?? "");

          const homeOwner = ownedMap.get(normTeam(homeTeam));
          const awayOwner = ownedMap.get(normTeam(awayTeam));

          const game = document.createElement("div");
          game.className = "game";
          game.innerHTML = `
            <div class="line">
              <div class="left">
                <div class="seed">${escapeHtml(g.homeSeed || "")}</div>
                <div class="team">${escapeHtml(homeTeam)}</div>
                ${homeOwner ? `<div class="owner">— ${escapeHtml(homeOwner.playerName)} (${escapeHtml(homeOwner.slotKey)})</div>` : ``}
              </div>
              <div class="score">${escapeHtml(String(hs))}</div>
            </div>
            <div class="line">
              <div class="left">
                <div class="seed">${escapeHtml(g.awaySeed || "")}</div>
                <div class="team">${escapeHtml(awayTeam)}</div>
                ${awayOwner ? `<div class="owner">— ${escapeHtml(awayOwner.playerName)} (${escapeHtml(awayOwner.slotKey)})</div>` : ``}
              </div>
              <div class="score">${escapeHtml(String(as))}</div>
            </div>
          `;
          gamesWrap.appendChild(game);
        });

        body.appendChild(gamesWrap);
      });

      card.appendChild(body);
      return card;
    }

    async function loadBracket(){
      const data = await jsonp(API, { action:"getBracket" });
      if (!data || !data.ok) throw new Error(data?.error || "Failed to load bracket");

      el("lastUpdate").textContent = data.updatedAt || "—";

      const ownedMap = new Map();
      (data.picks || []).forEach(p => {
        const t = normTeam(p.team);
        if (!t) return;
        ownedMap.set(t, { playerName:p.playerName, slotKey:p.slotKey, ballNumber:p.ballNumber });
      });

      const games = (data.tournamentGames || []).map(g => ({
        bracket: g.bracket || "",
        round: Number(g.round || 0),
        homeTeam: g.homeTeam || "TBD",
        awayTeam: g.awayTeam || "TBD",
        homeSeed: g.homeSeed || "",
        awaySeed: g.awaySeed || "",
        homeScore: g.homeScore,
        awayScore: g.awayScore
      })).filter(g => g.round >= 1 && g.round <= 4);

      const byRegion = groupBy(games, g => (g.bracket || "Region"));
      const grid = el("bracketGrid");
      grid.innerHTML = "";

      Array.from(byRegion.keys()).sort().forEach(region => {
        const gamesInRegion = byRegion.get(region) || [];
        const byRound = groupBy(gamesInRegion, g => g.round);
        grid.appendChild(renderRegion(region, byRound, ownedMap));
      });
    }

    /* ===== Zoom + Pan ===== */
    const viewport = el("viewport");
    const content = el("content");

    let scale = 1;
    let tx = 0, ty = 0;
    let dragging = false;
    let startX = 0, startY = 0;
    let startTx = 0, startTy = 0;

    function applyTransform(){
      content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }
    function clampScale(s){
      return Math.max(0.35, Math.min(2.5, s));
    }
    function zoomTo(newScale, cx, cy){
      newScale = clampScale(newScale);
      // zoom around cursor point
      const prev = scale;
      if (newScale === prev) return;

      const rect = viewport.getBoundingClientRect();
      const x = (cx ?? (rect.left + rect.width/2)) - rect.left;
      const y = (cy ?? (rect.top + rect.height/2)) - rect.top;

      const worldX = (x - tx) / prev;
      const worldY = (y - ty) / prev;

      scale = newScale;
      tx = x - worldX * scale;
      ty = y - worldY * scale;

      applyTransform();
    }
    function resetView(){
      scale = 1;
      tx = 0; ty = 0;
      applyTransform();
    }

    viewport.addEventListener("mousedown", (e)=>{
      dragging = true;
      viewport.classList.add("dragging");
      startX = e.clientX; startY = e.clientY;
      startTx = tx; startTy = ty;
    });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });
    window.addEventListener("mouseup", ()=>{
      dragging = false;
      viewport.classList.remove("dragging");
    });

    // Ctrl+wheel zoom
    viewport.addEventListener("wheel", (e)=>{
      if(!e.ctrlKey) return; // keep normal scroll unless ctrl pressed
      e.preventDefault();
      const delta = -e.deltaY;
      const factor = delta > 0 ? 1.08 : 0.92;
      zoomTo(scale * factor, e.clientX, e.clientY);
    }, { passive:false });

    el("zoomIn").addEventListener("click", ()=> zoomTo(scale * 1.12));
    el("zoomOut").addEventListener("click", ()=> zoomTo(scale * 0.88));
    el("zoomReset").addEventListener("click", resetView);

    function init(){
      el("pollBtn").addEventListener("click", () => loadBracket().catch(()=>{}));
      loadBracket().catch(()=>{});
      setInterval(()=> loadBracket().catch(()=>{}), POLL_MS);
      applyTransform();
    }
    init();
  </script>
</body>
</html>
