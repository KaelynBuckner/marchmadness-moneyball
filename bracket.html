<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness — Live Bracket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07162f; --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff; --muted:#9db7e6;
      --orange:#ff7a00; --blue:#2a66ff;
      --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.45);
      --elimBg: rgba(255,69,58,.12);
      --elimStroke: rgba(255,69,58,.22);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.24), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.18), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    .topbar{
      display:flex;gap:12px;align-items:center;justify-content:space-between;
      padding:14px 16px;border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(10px)
    }
    h1{margin:0;font-family:Oswald,Inter,sans-serif;letter-spacing:.6px;font-size:22px;line-height:1;color:var(--orange)}
    .sub{margin-top:2px;color:var(--muted);font-size:12px;font-weight:900}
    .btn{border:none;border-radius:14px;padding:11px 14px;color:white;font-weight:900;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
    .hint{color:var(--muted);font-size:12px;font-weight:900}
    .grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;margin-top:16px}
    @media (max-width:980px){.grid{grid-template-columns:1fr}}

    .card{border:1px solid var(--stroke);background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
    .head h2{margin:0;font-family:Oswald,Inter,sans-serif;font-size:18px;letter-spacing:.4px}
    .body{padding:16px}

    .slots{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:12px}
    .slot{
      padding:12px;border-radius:14px;background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
    }
    .slot.elim{ background: var(--elimBg); border-color: var(--elimStroke); }
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .slotKey{font-family:Oswald,Inter,sans-serif;font-weight:950;letter-spacing:.4px;color:var(--orange)}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(42,102,255,.14);border:1px solid rgba(42,102,255,.25);font-weight:950}
    .team{margin-top:6px;font-weight:950;line-height:1.2}
    .meta{margin-top:6px;color:var(--muted);font-size:12px;font-weight:900}
    .player{margin-top:10px;font-weight:950}
    .player small{color:var(--muted);font-weight:900}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>LIVE BRACKET</h1>
        <div class="sub">Teams auto-fill • Player names attach to bracket slots</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="hint" id="stamp">—</div>
        <button class="btn" id="pollNow">Poll Now</button>
      </div>
    </div>

    <div class="grid" id="regions"></div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const POLL_MS = 9000;

    const el = (id)=>document.getElementById(id);
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);
        window[cb] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
        function cleanup(){ try{ delete window[cb]; }catch{} script.remove(); }
        script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error("JSONP load error")); };

        document.head.appendChild(script);
      });
    }

    function groupByRegion(slots){
      const out = {};
      (slots||[]).forEach(s => {
        const r = s.region || "Other";
        (out[r] ||= []).push(s);
      });
      Object.keys(out).forEach(r => out[r].sort((a,b)=>Number(a.seed)-Number(b.seed)));
      return out;
    }

    function render(regionsMap){
      const container = el("regions");
      container.innerHTML = "";

      Object.keys(regionsMap).sort().forEach(region => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="head">
            <h2>${escapeHtml(region)}</h2>
            <div class="hint">Seed • Slot</div>
          </div>
          <div class="body">
            <div class="slots" id="slots_${escapeHtml(region).replace(/\W+/g,'_')}"></div>
          </div>
        `;
        container.appendChild(card);

        const slotsBox = card.querySelector(".slots");
        regionsMap[region].forEach(s => {
          const d = document.createElement("div");
          d.className = "slot" + (s.eliminated ? " elim" : "");
          d.innerHTML = `
            <div class="top">
              <div class="slotKey">${escapeHtml(s.slotKey)}</div>
              <div class="pill">Seed ${escapeHtml(String(s.seed || "—"))}</div>
            </div>
            <div class="team">${escapeHtml(s.teamName || "TBD")}</div>
            <div class="meta">${s.eliminated ? "Eliminated" : "Alive"}</div>
            <div class="player"><small>Player:</small> ${escapeHtml(s.playerName || "—")}</div>
          `;
          slotsBox.appendChild(d);
        });
      });
    }

    async function poll(){
      try{
        const data = await jsonp(API, { action:"getBracket" });
        if(!data || !data.ok){
          el("stamp").textContent = data?.error || "Load failed";
          return;
        }
        render(groupByRegion(data.slots || []));
        el("stamp").textContent = "Last update: " + new Date().toLocaleString();
      }catch(e){
        el("stamp").textContent = "API error";
      }
    }

    el("pollNow").addEventListener("click", poll);
    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
