<!DOCTYPE html>
<html>

<head>

<style>

body{
background:#0c1220;
color:white;
font-family:Arial;
padding:40px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #333;
}

</style>

</head>

<body>

<h1>Live Picks</h1>

<table>

<thead>
<tr>
<th>Name</th>
<th>Token</th>
<th>Ball</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

<script>

async function api(data){

const res=await fetch(location.href,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

return res.json();

}

async function load(){

const state=await api({action:"getState"});

const tbody=document.getElementById("rows");

tbody.innerHTML="";

state.picks.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${p.name}</td>
<td>${p.token}</td>
<td>${p.ball}</td>
`;

tbody.appendChild(tr);

});

}

load();

setInterval(load,10000);

</script>

</body>
</html>
