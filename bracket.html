<!-- bracket.html (repo root) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Money Madness — Live Bracket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07162f; --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff; --muted:#9db7e6;
      --blue:#2a66ff; --orange:#ff7a00;
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --glass: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
      --win: rgba(48,209,88,.16);
      --hi: rgba(255,122,0,.22);
      --hi2: rgba(42,102,255,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.26), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .topbar{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background:linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.12));
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .topInner{
      max-width:1780px; margin:0 auto; padding:16px 18px;
      display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .brand{display:flex; gap:12px; align-items:center}
    .mark{
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg,var(--orange),var(--blue));
      position:relative;overflow:hidden;
      box-shadow:0 12px 22px rgba(0,0,0,.35)
    }
    .mark:after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 55%);transform:rotate(20deg)}
    h1{
      margin:0; font-family:Oswald,Inter,sans-serif;
      letter-spacing:.8px; font-size:24px; line-height:1;
    }
    .sub{margin-top:4px;color:var(--muted);font-size:12px;font-weight:900}

    .controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
    .pill{
      display:flex; gap:10px; align-items:center;
      padding:10px 12px; border-radius:999px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
    }
    .pill span{color:var(--muted);font-size:12px}
    .pill b{font-family:Oswald,Inter,sans-serif;letter-spacing:.5px}

    .btn{
      border:none;border-radius:14px;padding:11px 14px;color:white;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,var(--orange),#ff4d00);
      box-shadow:0 12px 26px rgba(255,122,0,.22);
      user-select:none;
    }
    .btn.secondary{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:none;
    }

    .wrap{max-width:1780px;margin:0 auto;padding:18px}
    .viewer{
      border:1px solid rgba(255,255,255,.10);
      background:var(--glass);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      height: calc(100vh - 120px);
      position:relative;
    }
    .viewport{width:100%; height:100%; overflow:hidden; cursor:grab; touch-action:none;}
    .viewport.dragging{cursor:grabbing}
    .content{transform-origin:0 0; will-change:transform; padding:18px; min-width:2300px;}

    .grid{
      display:grid;
      grid-template-columns: 1fr 460px 1fr;
      gap:18px;
      align-items:start;
    }
    .panel{
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      background:rgba(0,0,0,.18);
      overflow:hidden;
    }
    .panelHead{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.20);
    }
    .panelHead h2{
      margin:0; font-family:Oswald,Inter,sans-serif;
      letter-spacing:.6px; font-size:16px;
    }

    .regions{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
      padding:14px;
    }
    .region{
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      background:rgba(0,0,0,.22);
      overflow:hidden;
    }
    .regionHead{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .regionHead b{font-family:Oswald,Inter,sans-serif; letter-spacing:.6px;}

    .roundLabels{
      display:grid;
      grid-template-columns: 260px 210px 170px 150px;
      gap:12px;
      padding:10px 12px;
      color:var(--muted);
      font-weight:900;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }
    .rounds{
      display:grid;
      grid-template-columns: 260px 210px 170px 150px;
      gap:12px;
      padding:0 12px 12px;
      align-items:start;
    }
    .col{display:grid; gap:12px}

    .game{
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      background:rgba(255,255,255,.03);
      overflow:hidden;
    }
    .teamRow{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:8px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .teamRow:last-child{border-bottom:none}

    .leftRow{display:flex; align-items:center; gap:10px; min-width:0}
    .seed{width:22px; text-align:center; font-family:Oswald,Inter,sans-serif; opacity:.95;}
    .teamText{min-width:0}
    .teamName{font-weight:950; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1;}
    .owner{margin-top:2px; color:var(--muted); font-size:11px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .score{font-family:Oswald,Inter,sans-serif; min-width:20px; text-align:right; opacity:.95;}

    .winnerRow{background:var(--win)}
    .hi{background:var(--hi); outline:2px solid rgba(255,122,0,.34)}
    .hi2{background:var(--hi2); outline:2px solid rgba(42,102,255,.26)}

    .centerBody{padding:14px}
    .centerStack{display:grid; gap:14px}
    .centerLabel{
      color:var(--muted);
      font-weight:900;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }
    .centerBlock{
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      background:rgba(0,0,0,.22);
      padding:12px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topInner">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>Live Bracket</h1>
          <div class="sub">All regions visible • Teams + player ownership populate live</div>
        </div>
      </div>

      <div class="controls">
        <div class="pill"><span>LAST UPDATE</span><b id="lastUpdate">—</b></div>
        <button class="btn secondary" id="pollBtn">Poll</button>
        <button class="btn secondary" id="zoomOut">−</button>
        <button class="btn secondary" id="zoomIn">+</button>
        <button class="btn secondary" id="zoomReset">Reset</button>
        <button class="btn" id="backBtn">Back to Pick</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="viewer">
      <div class="viewport" id="viewport">
        <div class="content" id="content">
          <div class="grid">
            <div class="panel">
              <div class="panelHead">
                <h2>LEFT SIDE</h2>
                <div style="color:var(--muted);font-weight:900;font-size:12px;">East + West</div>
              </div>
              <div class="regions" id="leftRegions"></div>
            </div>

            <div class="panel">
              <div class="panelHead">
                <h2>FINAL FOUR</h2>
                <div style="color:var(--muted);font-weight:900;font-size:12px;">Semis + Championship</div>
              </div>
              <div class="centerBody">
                <div class="centerStack">
                  <div class="centerLabel">National Semifinal</div>
                  <div class="centerBlock" id="ff1"></div>

                  <div class="centerLabel">National Semifinal</div>
                  <div class="centerBlock" id="ff2"></div>

                  <div class="centerLabel">National Championship</div>
                  <div class="centerBlock" id="champ"></div>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panelHead">
                <h2>RIGHT SIDE</h2>
                <div style="color:var(--muted);font-weight:900;font-size:12px;">South + Midwest</div>
              </div>
              <div class="regions" id="rightRegions"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const POLL_MS = 10000;
    const el = (id)=>document.getElementById(id);

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);
        window[cb] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
        function cleanup(){ try{ delete window[cb]; }catch{} script.remove(); }
        script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error("JSONP load error")); };
        document.head.appendChild(script);
      });
    }

    const LEFT = ["East","West"];
    const RIGHT = ["South","Midwest"];

    function emptyRegion(){
      const emptyGame = ()=>({
        home:{team:"TBD",seed:"",score:"",ownerName:"",ownerToken:"",slotKey:""},
        away:{team:"TBD",seed:"",score:"",ownerName:"",ownerToken:"",slotKey:""}
      });
      return { rounds:{ r1:Array.from({length:8},emptyGame), r2:Array.from({length:4},emptyGame), r3:Array.from({length:2},emptyGame), r4:Array.from({length:1},emptyGame) } };
    }

    function rowClass(t, opts){
      const cls = [];
      if (t.isWinner) cls.push("winnerRow");
      if (opts.highlightSlot && t.slotKey === opts.highlightSlot) cls.push("hi");
      if (opts.token && t.ownerToken && t.ownerToken === opts.token) cls.push("hi2");
      return cls.join(" ");
    }

    function renderTeamRow(t, opts){
      const team = t.team || "TBD";
      const seed = t.seed || "";
      const score = (t.score ?? "");
      const owner = t.ownerName ? t.ownerName : "";
      return `
        <div class="teamRow ${rowClass(t, opts)}">
          <div class="leftRow">
            <div class="seed">${escapeHtml(seed)}</div>
            <div class="teamText">
              <div class="teamName" title="${escapeHtml(team)}">${escapeHtml(team)}</div>
              <div class="owner">${owner ? escapeHtml(owner) : "Awaiting…"}</div>
            </div>
          </div>
          <div class="score">${escapeHtml(String(score))}</div>
        </div>
      `;
    }

    function renderGame(g, opts){
      return `
        <div class="game">
          ${renderTeamRow(g.home, opts)}
          ${renderTeamRow(g.away, opts)}
        </div>
      `;
    }

    function renderRegion(regionName, data, opts){
      const region = document.createElement("div");
      region.className = "region";

      const head = document.createElement("div");
      head.className = "regionHead";
      head.innerHTML = `<b>${escapeHtml(regionName)}</b><span style="color:var(--muted);font-weight:900;font-size:12px;">Region</span>`;
      region.appendChild(head);

      const labels = document.createElement("div");
      labels.className = "roundLabels";
      labels.innerHTML = `
        <div>First Round</div>
        <div>Second Round</div>
        <div>Sweet 16</div>
        <div>Elite 8</div>
      `;
      region.appendChild(labels);

      const rounds = document.createElement("div");
      rounds.className = "rounds";

      ["r1","r2","r3","r4"].forEach(k => {
        const col = document.createElement("div");
        col.className = "col";
        col.innerHTML = (data.rounds[k] || []).map(g => renderGame(g, opts)).join("");
        rounds.appendChild(col);
      });

      region.appendChild(rounds);
      return region;
    }

    function renderCenterBlock(target, game, opts){
      if (!game) {
        target.innerHTML = renderGame({home:{team:"TBD"},away:{team:"TBD"}}, opts);
        return;
      }
      target.innerHTML = renderGame(game, opts);
    }

    async function loadBracket(){
      const params = new URLSearchParams(location.search);
      const token = (params.get("token") || "").trim();
      const highlightSlot = (params.get("slot") || "").trim();

      const data = await jsonp(API, { action:"getBracketView", token, highlightSlot });
      if(!data || !data.ok) throw new Error(data?.error || "Failed to load bracket");

      el("lastUpdate").textContent = data.updatedAt || "—";
      const opts = { token, highlightSlot };

      const apiRegions = data.regions || {};

      const left = el("leftRegions");
      const right = el("rightRegions");
      left.innerHTML = "";
      right.innerHTML = "";

      LEFT.forEach(r => left.appendChild(renderRegion(r, apiRegions[r] || emptyRegion(), opts)));
      RIGHT.forEach(r => right.appendChild(renderRegion(r, apiRegions[r] || emptyRegion(), opts)));

      renderCenterBlock(el("ff1"), data.center?.ff1, opts);
      renderCenterBlock(el("ff2"), data.center?.ff2, opts);
      renderCenterBlock(el("champ"), data.center?.champ, opts);
    }

    // Zoom + pan
    const viewport = el("viewport");
    const content = el("content");
    let scale = 1, tx = 0, ty = 0;
    let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;

    function applyTransform(){ content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
    function clampScale(s){ return Math.max(0.35, Math.min(2.8, s)); }
    function zoomTo(newScale, cx, cy){
      newScale = clampScale(newScale);
      const prev = scale;
      if(newScale === prev) return;

      const rect = viewport.getBoundingClientRect();
      const x = (cx ?? (rect.left + rect.width/2)) - rect.left;
      const y = (cy ?? (rect.top + rect.height/2)) - rect.top;

      const worldX = (x - tx) / prev;
      const worldY = (y - ty) / prev;

      scale = newScale;
      tx = x - worldX * scale;
      ty = y - worldY * scale;
      applyTransform();
    }
    function resetView(){ scale = 1; tx = 0; ty = 0; applyTransform(); }

    viewport.addEventListener("mousedown", (e)=>{
      dragging = true; viewport.classList.add("dragging");
      startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
    });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });
    window.addEventListener("mouseup", ()=>{
      dragging = false; viewport.classList.remove("dragging");
    });

    el("zoomIn").addEventListener("click", ()=> zoomTo(scale * 1.12));
    el("zoomOut").addEventListener("click", ()=> zoomTo(scale * 0.88));
    el("zoomReset").addEventListener("click", resetView);

    el("pollBtn").addEventListener("click", ()=> loadBracket().catch(()=>{}));
    el("backBtn").addEventListener("click", ()=>{
      const tok = new URLSearchParams(location.search).get("token") || "";
      location.href = "./index.html" + (tok ? ("?token=" + encodeURIComponent(tok)) : "");
    });

    function init(){
      applyTransform();
      loadBracket().catch(()=>{});
      setInterval(()=> loadBracket().catch(()=>{}), POLL_MS);
    }
    init();
  </script>
</body>
</html>
