<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness • Live Bracket</title>

  <style>
    :root{
      --bg0:#070b16; --bg1:#0b1226;
      --text:#fff; --muted:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.12);
      --card:rgba(255,255,255,.07);
      --shadow: 0 18px 55px rgba(0,0,0,.55);

      /* BIGGER + MORE LEGIBLE */
      --boxW: 320px;
      --boxH: 84px;
      --gapY: 18px;

      --colGap: 110px;
      --stroke: rgba(255,255,255,.18);
      --hot: rgba(255,140,40,.42);
      --blue: rgba(88,170,255,.38);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 12% 12%, rgba(255,140,40,.14), transparent 60%),
        radial-gradient(900px 650px at 88% 25%, rgba(88,170,255,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }
    header{
      padding: 20px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent);
    }
    .wrap{ max-width: 1700px; margin:0 auto; padding: 16px; }
    h1{ margin:0; text-align:center; font-size: 34px; font-weight: 950; letter-spacing:.2px; }
    .sub{
      margin: 8px auto 0;
      text-align:center;
      color:var(--muted);
      font-size: 13px;
      max-width: 1200px;
      line-height:1.45;
      font-weight: 650;
    }

    .topbar{
      margin-top: 14px;
      display:flex; gap:10px; justify-content: space-between; align-items:center; flex-wrap:wrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      font-size: 13px;
      color: rgba(255,255,255,.90);
      white-space: nowrap;
      font-weight: 850;
    }
    .btn{
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
      height: 38px; padding: 0 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: #fff;
      font-weight: 900;
      transition: transform .12s ease, background .12s ease;
      cursor:pointer;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,.14); transform: translateY(-1px); }
    .btn.primary{ border-color: rgba(88,170,255,.34); background: rgba(88,170,255,.14); }

    .regions{
      margin-top: 14px;
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
    }
    @media (max-width: 1180px){ .regions{ grid-template-columns: 1fr; } }

    .regionCard{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.20);
      backdrop-filter: blur(14px);
      overflow:auto;
    }
    .regionHead{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      margin-bottom: 8px;
    }
    .regionHead h2{
      margin:0;
      font-size: 16px;
      font-weight: 950;
      letter-spacing:.2px;
    }
    .small{ color: var(--muted); font-size: 12px; font-weight: 800; }

    /* Bracket canvas */
    .bracketCanvas{
      position:relative;
      min-width: calc(var(--boxW) * 5 + var(--colGap) * 4 + 30px);
      padding: 10px 10px 18px;
      transform-origin: top left;
    }

    .lines{
      position:absolute;
      inset: 0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    .node{
      position:absolute;
      width: var(--boxW);
      height: var(--boxH);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(20,28,52,.55);
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap: 6px;
      overflow:hidden;
      box-shadow: 0 12px 26px rgba(0,0,0,.22);
    }

    .node.claimed{
      outline: 3px solid var(--hot);
      box-shadow: 0 0 18px rgba(255,140,40,.12), 0 12px 26px rgba(0,0,0,.22);
    }
    .node.mine{
      outline: 3px solid var(--blue);
      box-shadow: 0 0 18px rgba(88,170,255,.16), 0 12px 26px rgba(0,0,0,.22);
    }
    .node.highlight{
      outline: 3px solid rgba(255,255,255,.34);
      box-shadow: 0 0 22px rgba(255,255,255,.12), 0 12px 26px rgba(0,0,0,.22);
    }

    .topRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:baseline;
    }
    .slotCode{
      font-weight: 950;
      font-size: 13px;
      letter-spacing:.3px;
    }
    .seed{
      font-size: 12px;
      color: rgba(255,255,255,.78);
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
    }

    /* ESPN-style text hierarchy: Player is big */
    .playerLine{
      font-size: 16px;
      font-weight: 950;
      letter-spacing:.1px;
      line-height: 1.05;
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .teamLine{
      font-size: 13px;
      font-weight: 800;
      color: rgba(255,255,255,.82);
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .mutedLine{ color: rgba(255,255,255,.58); font-weight: 800; }

    .roundLabel{
      position:absolute;
      top: 0px;
      transform: translateY(-24px);
      font-size: 11px;
      color: rgba(255,255,255,.66);
      font-weight: 950;
      letter-spacing:.22px;
      text-transform: uppercase;
    }

    .errorBox{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,120,120,.30);
      background: rgba(255,120,120,.10);
      color: rgba(255,220,220,.95);
      font-weight: 900;
      display:none;
    }

    /* Zoom control */
    .zoomWrap{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      color: rgba(255,255,255,.86);
      font-weight: 900;
      font-size: 12px;
    }
    input[type="range"]{ accent-color: #58aaff; }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1>Money Madness • Live Bracket</h1>
    <div class="sub">
      Round of 64 shows <b>Player</b> (from BracketPicks) + <b>Team</b> (from Balls).
      Later rounds auto-fill from <b>BracketWinners</b>.
    </div>

    <div class="topbar">
      <div class="pill" id="counter">Loading…</div>
      <div class="pill" id="updated">Last updated: —</div>

      <div class="zoomWrap">
        <span>Zoom</span>
        <input id="zoom" type="range" min="70" max="130" value="100" />
        <span id="zoomVal">100%</span>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn primary" id="myPicksBtn" title="Highlight my picks if token is present">👤 My Picks: OFF</button>
        <a class="btn" href="./index.html">← Back</a>
      </div>
    </div>

    <div class="errorBox" id="err"></div>
  </div>
</header>

<main class="wrap">
  <div class="regions" id="regions"></div>
</main>

<script>
  // Same Apps Script /exec URL as index.html
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBXm6hLez-U4w2FF5bUtDfaxLlgLFtAGzp4z24IaBdwSEtHBySIKY9-zrow0rUQw/exec";

  // Standard R64 seed order
  const SEED_ORDER = [1,16,8,9,5,12,4,13,6,11,3,14,7,10,2,15];

  const REGIONS = [
    { name:"East", code:"E" },
    { name:"West", code:"W" },
    { name:"South", code:"S" },
    { name:"Midwest", code:"M" }
  ];

  const labels = ["Round of 64","Round of 32","Sweet 16","Elite 8","Regional Champ"];

  const regionsEl = document.getElementById("regions");
  const counterEl = document.getElementById("counter");
  const updatedEl = document.getElementById("updated");
  const errEl = document.getElementById("err");

  const myPicksBtn = document.getElementById("myPicksBtn");

  const qp = new URLSearchParams(location.search);
  const tokenParam = (qp.get("token") || "").trim();
  const slotParam  = (qp.get("slot") || "").trim(); // like S7 / E2 etc

  let myPicksOn = false;

  const zoom = document.getElementById("zoom");
  const zoomVal = document.getElementById("zoomVal");
  zoom.addEventListener("input", () => {
    zoomVal.textContent = `${zoom.value}%`;
    document.querySelectorAll(".bracketCanvas").forEach(c => c.style.transform = `scale(${Number(zoom.value)/100})`);
  });

  myPicksBtn.addEventListener("click", () => {
    myPicksOn = !myPicksOn;
    myPicksBtn.textContent = `👤 My Picks: ${myPicksOn ? "ON" : "OFF"}`;
    applyHighlights_();
  });

  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  async function api(action, payload = {}) {
    const form = new URLSearchParams({ action, ...payload });
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 12000);

    try {
      const res = await fetch(SCRIPT_URL, { method:"POST", body: form, signal: ctrl.signal });
      const text = await res.text();
      if (!text) return { ok:false, error:"Empty response from Apps Script." };
      try { return JSON.parse(text); }
      catch { return { ok:false, error:"Non-JSON response: " + text.slice(0,200) }; }
    } catch (e) {
      return { ok:false, error:String(e && e.message ? e.message : e) };
    } finally {
      clearTimeout(t);
    }
  }

  function buildPositions(){
    const y1 = [];
    const boxH = 84;   // match --boxH
    const gapY = 18;   // match --gapY
    for (let i=0;i<16;i++) y1.push(i*(boxH+gapY));
    const mid = (a,b)=> (a+b)/2;
    const y2 = []; for (let i=0;i<8;i++) y2.push(mid(y1[i*2], y1[i*2+1]));
    const y3 = []; for (let i=0;i<4;i++) y3.push(mid(y2[i*2], y2[i*2+1]));
    const y4 = []; for (let i=0;i<2;i++) y4.push(mid(y3[i*2], y3[i*2+1]));
    const y5 = [ mid(y4[0], y4[1]) ];
    return { y1,y2,y3,y4,y5, totalH: y1[15] + boxH };
  }

  function colX(roundIndex){
    const boxW = 320;  // match --boxW
    const colGap = 110;// match --colGap
    return roundIndex*(boxW + colGap);
  }

  function drawLines(svg, pos){
    function drawToNext(roundFrom, idxFromA, idxFromB, roundTo, idxTo){
      const xFrom = colX(roundFrom) + 320;
      const xMid  = colX(roundFrom) + 320 + 32;
      const xTo   = colX(roundTo);

      const yArrFrom = [pos.y1, pos.y2, pos.y3, pos.y4][roundFrom];
      const yArrTo   = [pos.y2, pos.y3, pos.y4, pos.y5][roundFrom];

      const yA = yArrFrom[idxFromA] + (84/2);
      const yB = yArrFrom[idxFromB] + (84/2);
      const yT = yArrTo[idxTo] + (84/2);

      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      const d = [
        `M ${xFrom} ${yA} L ${xMid} ${yA}`,
        `M ${xFrom} ${yB} L ${xMid} ${yB}`,
        `M ${xMid} ${yA} L ${xMid} ${yB}`,
        `M ${xMid} ${yT} L ${xTo} ${yT}`
      ].join(" ");
      path.setAttribute("d", d);
      path.setAttribute("fill","none");
      path.setAttribute("stroke","rgba(255,255,255,.22)");
      path.setAttribute("stroke-width","3");
      path.setAttribute("stroke-linecap","round");
      svg.appendChild(path);
    }

    for (let i=0;i<8;i++) drawToNext(0, i*2, i*2+1, 1, i);
    for (let i=0;i<4;i++) drawToNext(1, i*2, i*2+1, 2, i);
    for (let i=0;i<2;i++) drawToNext(2, i*2, i*2+1, 3, i);
    drawToNext(3, 0, 1, 4, 0);
  }

  function addNode(canvas, roundIndex, y, id, leftLabel, rightLabel, playerText, teamText, flags){
    const node = document.createElement("div");
    node.className = "node";
    node.style.left = colX(roundIndex) + "px";
    node.style.top  = (y + 10) + "px";
    node.id = id;

    if (flags?.claimed) node.classList.add("claimed");
    if (flags?.mine) node.classList.add("mine");

    const playerLine = playerText ? playerText : `<span class="mutedLine">Awaiting player…</span>`;
    const teamLine   = teamText ? teamText : `<span class="mutedLine">Awaiting team…</span>`;

    node.innerHTML = `
      <div class="topRow">
        <div class="slotCode">${escapeHtml(leftLabel)}</div>
        <div class="seed">${escapeHtml(rightLabel)}</div>
      </div>
      <div class="playerLine">${playerLine}</div>
      <div class="teamLine">${teamLine}</div>
    `;
    canvas.appendChild(node);
    return node;
  }

  function getWinnerMap(bracketWinners){
    const map = new Map();
    for (const w of (bracketWinners || [])){
      if (!w || !w.slotKey) continue;
      map.set(String(w.slotKey).trim(), w);
    }
    return map;
  }

  function getBallsMap(balls){
    const map = new Map();
    for (const b of (balls || [])){
      if (!b || !b.bracketSlot) continue;
      map.set(String(b.bracketSlot).trim(), b);
    }
    return map;
  }

  function getPicksMap(bracketPicks){
    const map = new Map();
    for (const p of (bracketPicks || [])){
      if (!p || !p.slotKey) continue;
      map.set(String(p.slotKey).trim(), p);
    }
    return map;
  }

  function createRegionCard(region, ballsBySlot, picksBySlot, winnerBySlotKey){
    const card = document.createElement("section");
    card.className = "regionCard";

    const head = document.createElement("div");
    head.className = "regionHead";
    head.innerHTML = `<h2>${region.name}</h2><div class="small">R64 → Regional Champ</div>`;
    card.appendChild(head);

    const canvas = document.createElement("div");
    canvas.className = "bracketCanvas";
    canvas.style.transform = `scale(${Number(zoom.value)/100})`;

    labels.forEach((txt, i)=>{
      const lab = document.createElement("div");
      lab.className = "roundLabel";
      lab.style.left = (colX(i) + 6) + "px";
      lab.textContent = txt;
      canvas.appendChild(lab);
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.classList.add("lines");
    svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
    canvas.appendChild(svg);

    const pos = buildPositions();
    const totalHeight = pos.totalH + 10;
    canvas.style.height = (totalHeight + 20) + "px";
    svg.setAttribute("viewBox", `0 0 ${colX(4) + 320} ${totalHeight + 20}`);
    svg.setAttribute("preserveAspectRatio", "none");
    drawLines(svg, pos);

    // R64: slot keys like E1..E16, S7, etc
    for (let i=0;i<16;i++){
      const seed = SEED_ORDER[i];
      const slot = `${region.code}${seed}`;
      const b = ballsBySlot.get(slot);
      const p = picksBySlot.get(slot);

      const player = p?.playerName ? String(p.playerName) : "";
      const playerToken = p?.token ? String(p.token) : "";
      const team = b?.team ? String(b.team) : "";

      const claimed = !!player;
      const mine = (myPicksOn && tokenParam && playerToken && tokenParam === playerToken);

      const playerText = player ? escapeHtml(player) : "";
      const teamText = team ? `<span style="opacity:.9">Team:</span> ${escapeHtml(team)}` : "";

      addNode(
        canvas, 0, pos.y1[i],
        `slot-${slot}`,
        slot,
        `Seed ${seed}`,
        playerText,
        teamText,
        { claimed, mine }
      );
    }

    // Later rounds from BracketWinners
    const roundSpecs = [
      { roundIndex: 1, arr: pos.y2, makeKey: (n)=>`R32-${region.code}${n}`, count: 8 },
      { roundIndex: 2, arr: pos.y3, makeKey: (n)=>`S16-${region.code}${n}`, count: 4 },
      { roundIndex: 3, arr: pos.y4, makeKey: (n)=>`E8-${region.code}${n}`,  count: 2 },
      { roundIndex: 4, arr: pos.y5, makeKey: ()=>`CHAMP-${region.code}`,     count: 1 }
    ];

    for (const spec of roundSpecs){
      for (let i=0;i<spec.count;i++){
        const n = i+1;
        const key = spec.makeKey(n);
        const w = winnerBySlotKey.get(key);

        const winnerTeam = w?.winnerTeam ? String(w.winnerTeam) : "";
        const winnerSeed = (w?.winnerSeed ?? "") !== "" ? String(w.winnerSeed) : "";

        const playerText = winnerTeam ? `<span style="opacity:.9">Winner:</span> ${escapeHtml(winnerTeam)}` : "";
        const teamText = winnerTeam ? `Advanced` : "";

        addNode(
          canvas, spec.roundIndex,
          spec.arr[i] ?? spec.arr[0],
          `slot-${key}`,
          key,
          winnerSeed ? `Seed ${winnerSeed}` : "Winner",
          playerText,
          teamText ? escapeHtml(teamText) : "",
          { claimed: Boolean(winnerTeam), mine: false }
        );
      }
    }

    card.appendChild(canvas);
    return card;
  }

  function applyHighlights_(){
    document.querySelectorAll(".node.mine").forEach(el => el.classList.remove("mine"));
    document.querySelectorAll(".node.highlight").forEach(el => el.classList.remove("highlight"));

    // Highlight the slot from query param
    if (slotParam) {
      const el = document.getElementById(`slot-${slotParam}`);
      if (el) {
        el.classList.add("highlight");
        el.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" });
      }
    }

    // Re-add mine highlights by checking data-token attribute? (we mark during render)
    // Render handles mine class based on tokenParam + myPicksOn, so reload is simplest.
    // But for responsiveness, we just reload the page state if toggled.
  }

  function setTopUI(balls){
    const claimed = (balls || []).filter(b => b && b.isClaimed).length;
    counterEl.innerHTML = `<b>${claimed}</b> of <b>68</b> balls claimed`;
    updatedEl.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  }

  async function load(){
    errEl.style.display = "none";
    const data = await api("getBracketData");

    if (!data.ok) {
      errEl.textContent = "Error: " + (data.error || "Unknown");
      errEl.style.display = "block";
      return;
    }

    const balls = data.balls || [];
    const bracketPicks = data.bracketPicks || [];
    const bracketWinners = data.bracketWinners || [];

    setTopUI(balls);

    const ballsBySlot = getBallsMap(balls);
    const picksBySlot = getPicksMap(bracketPicks);
    const winnerBySlotKey = getWinnerMap(bracketWinners);

    regionsEl.innerHTML = "";
    for (const r of REGIONS){
      regionsEl.appendChild(createRegionCard(r, ballsBySlot, picksBySlot, winnerBySlotKey));
    }

    applyHighlights_();
  }

  (async function init(){
    if (tokenParam) {
      myPicksOn = true;
      myPicksBtn.textContent = "👤 My Picks: ON";
    }
    await load();
    setInterval(load, 12000);
  })();
</script>
</body>
</html>
