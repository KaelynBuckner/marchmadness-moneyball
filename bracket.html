<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Money Madness — Live Bracket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07162f; --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff; --muted:#9db7e6;
      --blue:#2a66ff; --orange:#ff7a00;
      --radius:18px; --shadow:0 18px 50px rgba(0,0,0,.45);
      --card: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      --blk: rgba(0,0,0,.22);
      --hi: rgba(255,122,0,.20);
      --hi2: rgba(42,102,255,.16);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.28), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    .wrap{max-width:1780px;margin:0 auto;padding:18px}
    .topbar{
      display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
      padding:14px 16px;border:1px solid var(--stroke);
      background:var(--card);
      border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:blur(10px);
      position:sticky; top:12px; z-index:50;
    }
    .brand{display:flex;gap:12px;align-items:center}
    .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--blue));position:relative;overflow:hidden;box-shadow:0 12px 22px rgba(0,0,0,.35)}
    .mark:after{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 55%);transform:rotate(20deg)}
    .brand h1{margin:0;font-family:Oswald,Inter,sans-serif;letter-spacing:.6px;font-size:22px;line-height:1}
    .sub{margin-top:2px;color:var(--muted);font-size:12px;font-weight:800}

    .btn{
      border:none;border-radius:14px;padding:11px 14px;color:white;font-weight:900;cursor:pointer;
      background:linear-gradient(135deg,var(--orange),#ff4d00);
      box-shadow:0 12px 26px rgba(255,122,0,.22);
      user-select:none;
    }
    .btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--stroke);box-shadow:none}
    .pill{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--blk);border:1px solid var(--stroke);border-radius:999px;justify-content:center}
    .pill span{color:var(--muted);font-size:12px;font-weight:900}
    .pill b{font-family:Oswald,Inter,sans-serif;letter-spacing:.4px}

    .viewer{
      margin-top:16px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      height: calc(100vh - 130px);
      position:relative;
    }
    .viewport{width:100%; height:100%; overflow:hidden; cursor:grab; touch-action:none;}
    .viewport.dragging{cursor:grabbing}
    .content{transform-origin:0 0; will-change:transform; padding:16px; min-width:2100px;}

    .bracket{
      display:grid;
      grid-template-columns: 1fr 420px 1fr;
      gap:16px;
      align-items:start;
    }

    .side, .center{
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      background:var(--card);
      overflow:hidden;
    }
    .sideHeader, .centerHead{
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;justify-content:space-between;align-items:center;
    }
    .sideHeader h2, .centerHead h2{
      margin:0;font-family:Oswald,Inter,sans-serif;letter-spacing:.5px;font-size:16px;
    }
    .legend{color:var(--muted);font-size:12px;font-weight:900;display:flex;gap:10px;align-items:center;}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(255,122,0,.18)}
    .dot2{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(42,102,255,.18)}

    .regions2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      padding:12px;
    }
    .regionCard{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      border-radius:16px;
      overflow:hidden;
    }
    .regionHead{
      padding:10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;justify-content:space-between;align-items:center;
    }
    .regionHead b{font-family:Oswald,Inter,sans-serif;letter-spacing:.5px}

    .roundTitles{
      display:grid;
      grid-template-columns: 240px 190px 160px 140px;
      gap:10px;
      padding:10px 12px;
      color:var(--muted);
      font-weight:900;
      font-size:11px;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .rounds{
      display:grid;
      grid-template-columns: 240px 190px 160px 140px;
      gap:10px;
      padding:0 12px 12px;
      align-items:start;
    }
    .col{display:grid; gap:10px}
    .game{border:1px solid rgba(255,255,255,.10); border-radius:14px; background:rgba(255,255,255,.03); overflow:hidden}
    .teamRow{
      display:flex;justify-content:space-between;align-items:center;gap:8px;
      padding:7px 8px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .teamRow:last-child{border-bottom:none}
    .left{display:flex;align-items:center;gap:8px;min-width:0}
    .seed{width:22px;text-align:center;font-family:Oswald,Inter,sans-serif;opacity:.9}
    .name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .owner{color:var(--muted);font-size:11px;font-weight:900;white-space:nowrap}
    .score{font-family:Oswald,Inter,sans-serif;min-width:18px;text-align:right;opacity:.95}
    .win{background:rgba(48,209,88,.12)}
    .hi{background:var(--hi); outline:2px solid rgba(255,122,0,.32)}
    .hi2{background:var(--hi2); outline:2px solid rgba(42,102,255,.26)}

    .centerBody{padding:12px}
    .centerGrid{display:grid;gap:12px}
    .centerLabel{color:var(--muted);font-weight:900;font-size:11px;letter-spacing:.5px;text-transform:uppercase;}
    .centerBlock{border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(0,0,0,.22);padding:10px;}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>LIVE BRACKET</h1>
          <div class="sub">All 4 regions always visible • Updates teams/owners/scores live</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <div class="pill"><span>LAST UPDATE</span><b id="lastUpdate">—</b></div>
        <button class="btn secondary" id="pollBtn">Poll</button>
        <button class="btn secondary" id="zoomOut">−</button>
        <button class="btn secondary" id="zoomIn">+</button>
        <button class="btn secondary" id="zoomReset">Reset</button>
        <button class="btn" id="backBtn">Pick Page</button>
      </div>
    </div>

    <div class="viewer">
      <div class="viewport" id="viewport">
        <div class="content" id="content">
          <div class="bracket">
            <div class="side">
              <div class="sideHeader">
                <h2>LEFT SIDE</h2>
                <div class="legend"><span class="dot"></span> Highlight slot <span class="dot2"></span> Your token</div>
              </div>
              <div class="regions2" id="leftRegions"></div>
            </div>

            <div class="center">
              <div class="centerHead">
                <h2>FINAL FOUR + TITLE</h2>
                <div class="legend"><span class="dot"></span> Highlighted</div>
              </div>
              <div class="centerBody">
                <div class="centerGrid">
                  <div class="centerLabel">National Semifinal (Game 1)</div>
                  <div class="centerBlock" id="ff1"></div>

                  <div class="centerLabel">National Semifinal (Game 2)</div>
                  <div class="centerBlock" id="ff2"></div>

                  <div class="centerLabel">National Championship</div>
                  <div class="centerBlock" id="champ"></div>
                </div>
              </div>
            </div>

            <div class="side">
              <div class="sideHeader">
                <h2>RIGHT SIDE</h2>
                <div class="legend"><span class="dot"></span> Highlight slot <span class="dot2"></span> Your token</div>
              </div>
              <div class="regions2" id="rightRegions"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const POLL_MS = 10000;
    const el = (id)=>document.getElementById(id);

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => { cleanup(); reject(new Error("JSONP timeout")); }, 12000);
        window[cb] = (data) => { clearTimeout(timeout); cleanup(); resolve(data); };
        function cleanup(){ try{ delete window[cb]; }catch{} script.remove(); }
        script.onerror = () => { clearTimeout(timeout); cleanup(); reject(new Error("JSONP load error")); };
        document.head.appendChild(script);
      });
    }

    // Always show all 4 regions (even if API doesn’t have them yet)
    const REGION_ORDER_LEFT  = ["East","West"];
    const REGION_ORDER_RIGHT = ["South","Midwest"];

    function normalizeRegion(r){
      const s = String(r||"").toLowerCase().trim();
      if (s.startsWith("e")) return "East";
      if (s.startsWith("w")) return "West";
      if (s.startsWith("s")) return "South";
      if (s.startsWith("m")) return "Midwest";
      return r || "Region";
    }

    function emptyRegion(){
      const emptyGame = ()=>({
        home:{team:"TBD",seed:"",score:"",ownerName:"",ownerToken:"",slotKey:""},
        away:{team:"TBD",seed:"",score:"",ownerName:"",ownerToken:"",slotKey:""}
      });
      return { rounds:{ r1:Array.from({length:8},emptyGame), r2:Array.from({length:4},emptyGame), r3:Array.from({length:2},emptyGame), r4:Array.from({length:1},emptyGame) } };
    }

    function renderTeamRow(t, opts){
      const team = t.team || "TBD";
      const seed = t.seed || "";
      const score = (t.score ?? "");
      const owner = t.ownerName ? `— ${t.ownerName}` : "";
      const cls = [
        (t.isWinner ? "win" : ""),
        (opts.highlightSlot && t.slotKey === opts.highlightSlot ? "hi" : ""),
        (opts.token && t.ownerToken === opts.token ? "hi2" : "")
      ].filter(Boolean).join(" ");

      return `
        <div class="teamRow ${cls}">
          <div class="left">
            <div class="seed">${escapeHtml(seed)}</div>
            <div class="name" title="${escapeHtml(team)}">${escapeHtml(team)}</div>
            ${owner ? `<div class="owner">${escapeHtml(owner)}</div>` : ``}
          </div>
          <div class="score">${escapeHtml(String(score))}</div>
        </div>
      `;
    }

    function renderGame(g, opts){
      return `
        <div class="game">
          ${renderTeamRow(g.home, opts)}
          ${renderTeamRow(g.away, opts)}
        </div>
      `;
    }

    function renderRegionCard(regionName, regionData, opts){
      const card = document.createElement("div");
      card.className = "regionCard";

      const head = document.createElement("div");
      head.className = "regionHead";
      head.innerHTML = `<b>${escapeHtml(regionName)}</b><span style="color:var(--muted);font-weight:900;font-size:12px;">Region</span>`;
      card.appendChild(head);

      const titles = document.createElement("div");
      titles.className = "roundTitles";
      titles.innerHTML = `
        <div>First Round</div>
        <div>Second Round</div>
        <div>Sweet 16</div>
        <div>Elite 8</div>
      `;
      card.appendChild(titles);

      const rounds = document.createElement("div");
      rounds.className = "rounds";

      ["r1","r2","r3","r4"].forEach(k => {
        const col = document.createElement("div");
        col.className = "col";
        col.innerHTML = (regionData.rounds[k] || []).map(g => renderGame(g, opts)).join("");
        rounds.appendChild(col);
      });

      card.appendChild(rounds);
      return card;
    }

    function renderCenterBlock(blockEl, game, opts){
      if (!game) {
        blockEl.innerHTML = renderGame({home:{team:"TBD"},away:{team:"TBD"}}, opts);
        return;
      }
      blockEl.innerHTML = renderGame(game, opts);
    }

    async function loadBracket(){
      const params = new URLSearchParams(location.search);
      const token = (params.get("token") || "").trim();
      const highlightSlot = (params.get("slot") || "").trim();

      const data = await jsonp(API, { action:"getBracketView", token, highlightSlot });
      if(!data || !data.ok) throw new Error(data?.error || "Failed to load bracket");

      el("lastUpdate").textContent = data.updatedAt || "—";

      const opts = { token, highlightSlot };

      const left = el("leftRegions");
      const right = el("rightRegions");
      left.innerHTML = "";
      right.innerHTML = "";

      // Normalize keys coming from API
      const apiRegions = {};
      Object.keys(data.regions || {}).forEach(k => apiRegions[normalizeRegion(k)] = data.regions[k]);

      REGION_ORDER_LEFT.forEach(r => {
        const region = apiRegions[normalizeRegion(r)] || emptyRegion();
        left.appendChild(renderRegionCard(normalizeRegion(r), region, opts));
      });

      REGION_ORDER_RIGHT.forEach(r => {
        const region = apiRegions[normalizeRegion(r)] || emptyRegion();
        right.appendChild(renderRegionCard(normalizeRegion(r), region, opts));
      });

      renderCenterBlock(el("ff1"), data.center?.ff1, opts);
      renderCenterBlock(el("ff2"), data.center?.ff2, opts);
      renderCenterBlock(el("champ"), data.center?.champ, opts);
    }

    // Zoom + pan
    const viewport = el("viewport");
    const content = el("content");
    let scale = 1, tx = 0, ty = 0;
    let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;

    function applyTransform(){ content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
    function clampScale(s){ return Math.max(0.35, Math.min(2.8, s)); }
    function zoomTo(newScale, cx, cy){
      newScale = clampScale(newScale);
      const prev = scale;
      if(newScale === prev) return;

      const rect = viewport.getBoundingClientRect();
      const x = (cx ?? (rect.left + rect.width/2)) - rect.left;
      const y = (cy ?? (rect.top + rect.height/2)) - rect.top;

      const worldX = (x - tx) / prev;
      const worldY = (y - ty) / prev;

      scale = newScale;
      tx = x - worldX * scale;
      ty = y - worldY * scale;
      applyTransform();
    }
    function resetView(){ scale = 1; tx = 0; ty = 0; applyTransform(); }

    viewport.addEventListener("mousedown", (e)=>{
      dragging = true; viewport.classList.add("dragging");
      startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
    });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });
    window.addEventListener("mouseup", ()=>{
      dragging = false; viewport.classList.remove("dragging");
    });
    viewport.addEventListener("wheel", (e)=>{
      if(!e.ctrlKey) return;
      e.preventDefault();
      const factor = (-e.deltaY) > 0 ? 1.08 : 0.92;
      zoomTo(scale * factor, e.clientX, e.clientY);
    }, { passive:false });

    el("zoomIn").addEventListener("click", ()=> zoomTo(scale * 1.12));
    el("zoomOut").addEventListener("click", ()=> zoomTo(scale * 0.88));
    el("zoomReset").addEventListener("click", resetView);

    el("pollBtn").addEventListener("click", ()=> loadBracket().catch(()=>{}));
    el("backBtn").addEventListener("click", ()=>{
      const tok = new URLSearchParams(location.search).get("token") || "";
      location.href = "index.html" + (tok ? ("?token=" + encodeURIComponent(tok)) : "");
    });

    function init(){
      applyTransform();
      loadBracket().catch(()=>{});
      setInterval(()=> loadBracket().catch(()=>{}), POLL_MS);
    }
    init();
  </script>
</body>
</html>
