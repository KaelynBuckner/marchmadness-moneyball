<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Money Madness — Live Board</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#07162f;
      --bg2:#0e2a55;
      --stroke:rgba(255,255,255,.10);
      --text:#eaf2ff;
      --muted:#9db7e6;
      --orange:#ff7a00;
      --radius:18px;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(42,102,255,.24), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(255,122,0,.18), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:18px; }

    .topbar{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 16px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }
    h1{
      margin:0;
      font-family:Oswald,Inter,sans-serif;
      letter-spacing:.6px;
      font-size:22px;
      line-height:1.0;
      color:var(--orange);
    }
    .sub{ margin-top:2px; color:var(--muted); font-size:12px; font-weight:700; }
    .pill{
      display:flex; gap:10px; align-items:center;
      padding:10px 12px;
      background:rgba(0,0,0,.22);
      border:1px solid var(--stroke);
      border-radius:999px;
      min-width:150px;
      justify-content:center;
    }
    .pill span{ color:var(--muted); font-size:12px; font-weight:800; }
    .pill b{ font-family:Oswald,Inter,sans-serif; letter-spacing:.4px; }
    .btn{
      border:none;
      border-radius:14px;
      padding:11px 14px;
      color:white;
      font-weight:800;
      cursor:pointer;
      background:rgba(255,255,255,.06);
      border:1px solid var(--stroke);
    }

    .card{
      margin-top:16px;
      border:1px solid var(--stroke);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .cardHead{
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .cardHead h2{
      margin:0;
      font-family:Oswald,Inter,sans-serif;
      font-size:18px;
      letter-spacing:.4px;
    }
    .cardBody{ padding:16px; }

    table{ width:100%; border-collapse:separate; border-spacing:0 10px; }
    th{
      text-align:left;
      color:var(--muted);
      font-size:12px;
      letter-spacing:.3px;
      font-weight:900;
      padding:0 10px 6px 10px;
    }
    td{
      padding:12px 10px;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      font-weight:800;
      vertical-align:middle;
    }
    tr td:first-child{ border-radius:14px 0 0 14px; }
    tr td:last-child{ border-radius:0 14px 14px 0; }

    .ballTag{
      font-family:Oswald,Inter,sans-serif;
      letter-spacing:.5px;
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,122,0,.16);
      border:1px solid rgba(255,122,0,.28);
    }
    .hint{ color:var(--muted); font-size:12px; font-weight:700; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>LIVE BOARD</h1>
        <div class="sub">Money Madness — picks update automatically</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;">
        <div class="pill"><span>BALLS LEFT</span><b id="ballsLeft">—</b></div>
        <div class="pill"><span>TOTAL PICKS</span><b id="totalPicks">—</b></div>
        <button class="btn" id="pollNow">Poll Now</button>
      </div>
    </div>

    <div class="card">
      <div class="cardHead">
        <h2>All Picks</h2>
        <div class="hint" id="stamp">—</div>
      </div>
      <div class="cardBody">
        <table>
          <thead>
            <tr>
              <th style="width:44%">PLAYER</th>
              <th style="width:22%">BALL</th>
              <th style="width:34%">TIME</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="hint" id="empty" style="display:none;">No picks yet.</div>
      </div>
    </div>
  </div>

  <script>
    // ✅ Your Apps Script Web App URL
    const API = "https://script.google.com/macros/s/AKfycbzplqX-cV6Fk80vHyCFrk3kxO4ZJIj7PkahyP-TZ37krUn1mhH5mM0AfywGFMbWVuQ/exec";
    const POLL_MS = 7000;

    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "cb_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        const qs = new URLSearchParams({ ...params, callback: cb });
        script.src = url + (url.includes("?") ? "&" : "?") + qs.toString();
        script.async = true;

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("JSONP timeout"));
        }, 12000);

        window[cb] = (data) => {
          clearTimeout(timeout);
          cleanup();
          resolve(data);
        };

        function cleanup() {
          try { delete window[cb]; } catch {}
          script.remove();
        }

        script.onerror = () => {
          clearTimeout(timeout);
          cleanup();
          reject(new Error("JSONP load error"));
        };

        document.head.appendChild(script);
      });
    }

    const el = (id) => document.getElementById(id);
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    async function poll(){
      try{
        const data = await jsonp(API, { action:"getAllPicks" });
        if(!data || !data.ok){
          el("stamp").textContent = data?.error || "Load failed";
          return;
        }

        el("ballsLeft").textContent = String(data.ballsRemaining ?? "—");
        el("totalPicks").textContent = String((data.picks || []).length);

        const tbody = el("rows");
        tbody.innerHTML = "";
        const picks = data.picks || [];
        el("empty").style.display = picks.length ? "none" : "block";

        picks.slice().reverse().forEach(p => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escapeHtml(p.playerName || "Unknown")}</td>
            <td><span class="ballTag">BALL ${escapeHtml(String(p.ballNumber))}</span></td>
            <td class="hint">${escapeHtml(p.time || "")}</td>
          `;
          tbody.appendChild(tr);
        });

        el("stamp").textContent = "Last update: " + new Date().toLocaleString();
      }catch(e){
        el("stamp").textContent = "API error";
      }
    }

    el("pollNow").addEventListener("click", poll);
    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
